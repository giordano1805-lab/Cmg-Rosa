name: CMg Santa Rosa
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "reporte, escucha, pdf o explora"
        default: "reporte"
permissions:
  contents: write
concurrency:
  group: cmg2-${{ github.event.inputs.modo }}
jobs:
  cmg:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests matplotlib openpyxl xlrd reportlab
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TC: ${{ vars.TC }}
          ALERTA_CMG: ${{ vars.ALERTA_CMG }}
          MODO: ${{ github.event.inputs.modo }}
        run: python "cmg santarosa.py"
      - if: always()
        run: |
          git config user.name "cmg-bot"
          git config user.email "cmg-bot@users.noreply.github.com"
          git add data docs || true
          if ! git diff --cached --quiet; then
            git commit -m "CMg $(date -u +%FT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
