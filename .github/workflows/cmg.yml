name: CMg Santa Rosa
on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cmg
jobs:
  cmg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests matplotlib
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TC: ${{ vars.TC }}
          ALERTA_CMG: ${{ vars.ALERTA_CMG }}
          MODO: ${{ github.event.schedule == '*/5 * * * *' && 'escucha' || 'reporte' }}
        run: python "cmg santarosa.py"
      - if: always()
        run: |
          git config user.name "cmg-bot"
          git config user.email "cmg-bot@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet || (git commit -m "CMg $(date -u +%FT%H:%MZ)" && git push)
