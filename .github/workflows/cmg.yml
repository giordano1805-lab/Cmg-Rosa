name: CMg Santa Rosa
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      diagnostico:
        description: "Enviar diagnóstico (1 = sí)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: cmg
jobs:
  cmg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: |
          pip install playwright requests matplotlib beautifulsoup4
          python -m playwright install --with-deps chromium
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTA_CMG: ${{ vars.ALERTA_CMG }}
          BARRA_REGEX: ${{ vars.BARRA_REGEX }}
          FORZAR_DIAG: ${{ github.event.inputs.diagnostico }}
        run: python "cmg santarosa.py"
      - if: always()
        run: |
          git config user.name "cmg-bot"
          git config user.email "cmg-bot@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet || (git commit -m "CMg $(date -u +%FT%H:%MZ)" && git push)
