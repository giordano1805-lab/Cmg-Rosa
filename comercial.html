<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte Comercial Huanchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f7;--surface:#fff;--surface-2:#f0f2f5;--border:#e2e4e8;--text:#0b0b0b;--text-2:#52514e;--muted:#7c7b77;
  --brand:#001a6f;--naranja:#ff5716;--amarillo:#ffb210;--navy:#1d3a8a;--h1:#001a6f;
  --s1:#2b4fd1;--s2:#f0590f;--s3:#e9a300;--s4:#1baf7a;--s5:#e87ba4;--s7:#6250d6;--s8:#e34948;--s9:#8f1d2c;
  --base:#1f6f9f;--media:#f0590f;--punta:#13803f;--teal:#1aa3a3;
  --grid:rgba(0,0,0,.07);--card-b:rgba(0,26,111,.09);--sombra:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(0,26,111,.14);
  --tinte:rgba(255,87,22,.10);--tinte2:rgba(0,26,111,.06);--ok:#137333;--bad:#c5221f;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--surface-2:#232321;--border:#2f2f2c;--text:#f0efec;--text-2:#c3c2b7;--muted:#9a9993;
  --navy:#9fb1f7;--h1:#c9d3ff;--s1:#6f8bf5;--s2:#ff7a3d;--s3:#d1a21c;--s4:#26b583;--s7:#9085e9;--s8:#ee6b6b;--base:#5fa7d6;--media:#ff7a3d;--punta:#36b56a;--teal:#3cc4c4;
  --grid:rgba(255,255,255,.08);--card-b:rgba(255,255,255,.07);--sombra:0 10px 28px -14px rgba(0,0,0,.7);--tinte:rgba(255,106,46,.16);--tinte2:rgba(143,166,255,.10);--ok:#81c995;--bad:#f28b82}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--surface-2:#232321;--border:#2f2f2c;--text:#f0efec;--text-2:#c3c2b7;--muted:#9a9993;
  --navy:#9fb1f7;--h1:#c9d3ff;--s1:#6f8bf5;--s2:#ff7a3d;--s3:#d1a21c;--s4:#26b583;--s7:#9085e9;--s8:#ee6b6b;--base:#5fa7d6;--media:#ff7a3d;--punta:#36b56a;--teal:#3cc4c4;
  --grid:rgba(255,255,255,.08);--card-b:rgba(255,255,255,.07);--sombra:0 10px 28px -14px rgba(0,0,0,.7);--tinte:rgba(255,106,46,.16);--tinte2:rgba(143,166,255,.10);--ok:#81c995;--bad:#f28b82}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;
  background:radial-gradient(1200px 420px at 85% -120px,rgba(255,178,16,.10),transparent 60%),radial-gradient(900px 380px at -10% -80px,rgba(0,26,111,.07),transparent 60%),var(--bg)}
:focus-visible{outline:2px solid var(--naranja);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{background:#fff;padding:12px 16px;border-bottom:4px solid transparent;border-image:linear-gradient(90deg,var(--naranja),var(--amarillo)) 1;box-shadow:0 1px 0 rgba(0,26,111,.06)}
header .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0}
header img{height:40px;display:none}
header h1{font-size:17px;margin:0;font-weight:700;color:var(--brand);padding-left:14px;border-left:1px solid #d9dce6}
header .meta{margin-left:auto;font-size:12.5px;color:#52514e;text-align:right}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer;border:1px solid #c9cde0;background:#fff;color:var(--brand)}
.btn.pri{background:linear-gradient(180deg,#ff6a2e,var(--naranja));border-color:transparent;color:#fff;box-shadow:0 2px 6px -2px rgba(255,87,22,.55)}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav a{color:var(--text-2);text-decoration:none;font-weight:500;padding:12px 11px;border-bottom:2px solid transparent;white-space:nowrap}
nav a:hover{color:var(--text);background:var(--tinte2)}
nav a.on{color:var(--text);font-weight:600;border-color:var(--naranja)}
main{padding:18px 0 48px}
.portada{position:relative;overflow:hidden;border-radius:18px;padding:34px 32px;background:
  radial-gradient(circle at 1px 1px,rgba(43,79,209,.18) 1px,transparent 1.4px) 0 0/10px 10px,linear-gradient(115deg,var(--surface) 42%,rgba(234,240,255,.9) 42.2%);border:1px solid var(--card-b);box-shadow:var(--sombra)}
:root[data-theme="dark"] .portada{background:radial-gradient(circle at 1px 1px,rgba(143,166,255,.16) 1px,transparent 1.4px) 0 0/10px 10px,linear-gradient(115deg,var(--surface) 42%,#1b2547 42.2%)}
.portada .eyb{font-weight:800;color:var(--brand);letter-spacing:.02em;font-size:13px}
:root[data-theme="dark"] .portada .eyb{color:#c9d3ff}
.portada h2{margin:10px 0 6px;font-size:44px;line-height:1.02;letter-spacing:-1px;border-left:6px solid var(--naranja);padding-left:14px}
.portada h2 span{display:block;color:var(--naranja)} .portada h2 b{color:var(--h1)}
.portada .sem{font-size:18px;color:var(--text-2);margin:8px 0 0 20px}
.portada .kp{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.portada .kp div{flex:1 1 140px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(4px);border:1px solid var(--card-b);border-radius:12px;padding:10px 14px;min-width:150px}
.portada .kp b{display:block;font-size:22px;color:var(--h1);font-variant-numeric:tabular-nums}.portada .kp span{font-size:12px;color:var(--text-2)}
section.sec{margin-top:26px;scroll-margin-top:60px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sh .t{border-left:6px solid;border-image:linear-gradient(180deg,var(--naranja),var(--amarillo)) 1;padding-left:12px}
.sh .t small{display:block;font-weight:800;color:var(--naranja);font-size:13px;letter-spacing:.04em}
.sh h2{margin:2px 0 0;font-size:24px;color:var(--h1);letter-spacing:-.3px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g64{grid-template-columns:minmax(0,62fr) minmax(0,38fr)}
.card{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 92%,var(--bg)));border:1px solid var(--card-b);border-radius:14px;padding:14px 16px;min-width:0;box-shadow:var(--sombra)}
.card h3{margin:0 0 8px;font-size:15px;color:var(--h1)}.card h3 small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.chart{position:relative;height:300px}.chart.tall{height:380px}.chart.sm{height:230px}
.seg{display:inline-flex;gap:4px;padding:3px;border-radius:9px;background:var(--tinte2);box-shadow:inset 0 1px 2px rgba(0,26,111,.08);flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--text-2);font:inherit;font-size:13px;padding:6px 12px;border-radius:7px;cursor:pointer;min-height:32px}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#ff6a2e,var(--naranja));color:#fff;font-weight:600;box-shadow:0 2px 6px -2px rgba(255,87,22,.55)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(180deg,#ff6a2e,var(--naranja));box-shadow:0 2px 8px -3px rgba(255,87,22,.6)}
.pill.nv{background:linear-gradient(180deg,#26449c,#001a6f);box-shadow:0 2px 8px -3px rgba(0,26,111,.6)}
.pill.gr{background:var(--surface-2);color:var(--text-2);box-shadow:none;border:1px solid var(--card-b);font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--tinte2);color:var(--text-2)}
.chip.ok{background:rgba(27,175,122,.14);color:#0f7a54}.chip.or{background:var(--tinte);color:#c2410c}.chip.bad{background:rgba(197,34,31,.12);color:var(--bad)}
.mut{color:var(--muted);font-size:12.5px}.note{color:var(--muted);font-size:12px;margin-top:8px}
.estado{display:flex;gap:8px;align-items:center;padding:12px 14px;border-radius:10px;border:1px dashed var(--card-b);color:var(--text-2);font-size:13px;background:var(--surface)}
.estado.par{border-style:solid;border-color:transparent;background:#fff1e8;color:#8a2d00}
:root[data-theme="dark"] .estado.par{background:#3a2216;color:#ffc9a8}
.mant{margin:0;padding:0;list-style:none;columns:2;column-gap:22px}
.mant li{break-inside:avoid;padding:6px 0;border-bottom:1px dashed var(--card-b);font-size:13px;display:flex;gap:8px;align-items:baseline}
.mant li b{color:var(--h1)}.mant .mw{margin-left:auto;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.mant .tg{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--tinte2);color:var(--text-2)}
.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2);margin:-2px 0 6px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.kc{display:flex;gap:12px;align-items:flex-start}
.kc .ki{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--tinte);color:var(--naranja)}
.kc .l{color:var(--text-2);font-size:13px;font-weight:600}.kc .v{font-size:28px;font-weight:700;color:var(--h1);font-variant-numeric:tabular-nums;line-height:1.15}
.kc .v small{font-size:13px;font-weight:500;color:var(--text-2);margin-left:4px}.kc .s{font-size:12.5px;color:var(--text-2);margin-top:2px}
.cent{font-size:12.5px;color:var(--text-2);margin-top:8px;line-height:1.7}
.cent .tot{display:inline-block;background:#fff3c4;color:#001a6f;font-weight:700;padding:1px 8px;border-radius:6px;margin-left:6px}
.tbl{overflow:auto;border:1px solid var(--card-b);border-radius:10px;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:640px}table.min{min-width:0}
th,td{padding:7px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border)}
th{position:sticky;top:0;background:color-mix(in srgb,var(--surface-2) 85%,var(--tinte2));font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);white-space:nowrap}
thead tr.grp th{text-align:center;background:linear-gradient(180deg,#1aa3a3,#138585);color:#fff}
thead tr.grp th.vacio{background:color-mix(in srgb,var(--surface-2) 85%,var(--tinte2))}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface) 96%,var(--tinte2))}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tools input{flex:1;min-width:160px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}
.tools .n{color:var(--muted);font-size:12.5px}
.tools button{border:1px solid var(--card-b);background:var(--surface);color:var(--text-2);border-radius:7px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.box{border-radius:12px;padding:12px 14px;background:linear-gradient(180deg,#1aa3a3,#138585);color:#fff;text-align:center;font-weight:700;box-shadow:var(--sombra)}
.box b{display:block;font-size:22px}
.pie{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:space-between;color:var(--muted);font-size:11.5px;border-top:1px dashed var(--card-b);padding-top:8px;margin-top:22px}
.pie b{color:var(--text-2)}
@media (max-width:860px){.g2,.g3,.g64{grid-template-columns:1fr}.mant{columns:1}.portada h2{font-size:34px}}
@media (max-width:600px){header img{height:30px}header h1{font-size:15px;border:0;padding-left:0;width:100%}header .meta{margin-left:0;text-align:left}.portada{padding:24px 18px}.portada h2{font-size:30px}.chart{height:250px}.chart.tall{height:300px}}
@media print{nav,header .btn,#tema{display:none!important}body{background:#fff}section.sec{break-before:page}.card{box-shadow:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <img id="logo" src="logo.png" alt="Hidroeléctrica Huanchor" onload="this.style.display='block'">
  <h1>Reporte comercial</h1>
  <div class="meta" id="meta" aria-live="polite">Cargando…</div>
  <button class="btn pri" id="upd" type="button" title="Volver a leer los datos publicados">⟳ Actualizar</button>
  <button class="btn" type="button" onclick="print()">Imprimir / PDF</button>
  <a class="btn" href="index.html">Dashboard SEIN</a>
  <button class="btn" id="tema" type="button" aria-label="Cambiar tema claro u oscuro">Tema</button>
</div></header>
<nav aria-label="Secciones del reporte"><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="main"><div class="estado" role="status">Cargando datos…</div></main>
<script>
const $=s=>document.querySelector(s);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fin=v=>v!=null&&isFinite(v);
const nf=(a,b)=>v=>fin(v)?Number(v).toLocaleString("es-PE",{minimumFractionDigits:a,maximumFractionDigits:b}):"–";
const f0=nf(0,0),f1=nf(1,1),f2=nf(2,2);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MESC=["ene","feb","mar","abr","may","jun","jul","ago","set","oct","nov","dic"],MESN=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
const MESL=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Set","Oct","Nov","Dic"];
const fL=s=>s?`${+s.slice(8,10)} de ${MESN[+s.slice(5,7)-1]} de ${s.slice(0,4)}`:"";
const ddmm=s=>s?s.slice(8,10)+"/"+s.slice(5,7):"";
const romanos=s=>String(s??"").replace(/\b(ii|iii|iv|vi|vii|viii|ix|xi|xii)\b/gi,m=>m.toUpperCase());
const tit=s=>romanos((s||"").toLowerCase().replace(/(^|[\s.(\/-])([a-záéíóúñü])/g,(m,a,b)=>a+b.toUpperCase()));
const mesesEntre=(a,b)=>{const o=[];let [y,m]=a.split("-").map(Number);const [y2,m2]=b.split("-").map(Number);while(y<y2||(y===y2&&m<=m2)){o.push(`${y}-${String(m).padStart(2,"0")}`);m++;if(m>12){m=1;y++}}return o};
const mLab=k=>`${MESL[+k.slice(5)-1]}-${k.slice(2,4)}`;
let D=null,C=null,charts=[],VRF=false;
// Reserva del Programa Semanal para la semana operativa (sábado–viernes) que contiene la fecha del reporte
function resSemana(){const P=D.cmg_proy;if(!P||!P.reserva||!P.reserva.length)return null;
  const h=new Date(D.hoy+"T12:00"),sat=new Date(h);sat.setDate(h.getDate()-((h.getDay()+1)%7));const iso=x=>x.toISOString().slice(0,10);
  const d0=iso(sat),fri=new Date(sat);fri.setDate(sat.getDate()+6);const d1=iso(fri);
  const fdia=t=>{const d=new Date(t);d.setMinutes(d.getMinutes()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
  let rs=P.reserva.filter(r=>{const f=fdia(r[0]);return f>=d0&&f<=d1});if(!rs.length)rs=P.reserva;
  const g=rs.filter(r=>fin(r[3]));if(!g.length)return null;
  const min=g.reduce((a,r)=>r[3]<a[1]?[r[0],r[3]]:a,[g[0][0],g[0][3]]),now=new Date(D.generado);
  const ahora=g.filter(r=>new Date(r[0])<=new Date(now.getTime()+18e5)).pop();
  return{rs,d0,d1,sem:semanaCOES(d0),min,prom:g.reduce((a,r)=>a+r[3],0)/g.length,ahora:ahora?[ahora[0],ahora[3]]:null,cero:g.filter(r=>r[3]<=0.5).length}}
// Semana operativa del COES: de sábado a viernes; la semana 1 empieza el primer sábado del año
function semanaCOES(s){const d=new Date(s+"T12:00");let y=d.getFullYear(),p=new Date(y,0,1,12);while(p.getDay()!==6)p.setDate(p.getDate()+1);
  if(d<p){y--;p=new Date(y,0,1,12);while(p.getDay()!==6)p.setDate(p.getDate()+1)}return Math.floor((d-p)/864e5/7)+1}
function base(yTit){const g=css("--grid"),t=css("--text-2");return{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},
  plugins:{legend:{labels:{color:t,usePointStyle:true,pointStyle:"circle",boxWidth:7,boxHeight:7,padding:14}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${f1(c.parsed.y)}`}}},
  scales:{x:{grid:{color:g,drawTicks:false},border:{display:false},ticks:{color:t,maxRotation:0,autoSkip:true,padding:6}},y:{grid:{color:g,drawTicks:false},border:{display:false},ticks:{color:t,padding:6},title:{display:!!yTit,text:yTit,color:t}}}}}
const graf=(id,cfg)=>{const el=$(id);if(!el)return;charts.push(new Chart(el,cfg))};
const cv=(id,txt,h="")=>`<div class="chart ${h}"><canvas id="${id}" role="img" aria-label="${esc(txt)}"></canvas></div>`;
const kc=(ic,l,v,un,s)=>`<div class="card kc"><span class="ki" aria-hidden="true">${ic}</span><div><div class="l">${l}</div><div class="v">${v}${un?`<small>${un}</small>`:""}</div>${s?`<div class="s">${s}</div>`:""}</div></div>`;
const ANIOC=["--muted","--s4","--navy","--naranja"];
const SECS=[["cmg","Evolución CMg"],["mant","Mantenimientos"],["mercado","Mercado y reserva"],["caudales","Caudales"],["volumenes","Embalses"]];
let CMM="act",MTM="dia";

function tabla(el,cols,filas,o={}){let q="";const id=el.replace("#","");const box=$(el);if(!box)return;
  const pintar=()=>{const fs=filas.filter(f=>!q||JSON.stringify(f).toLowerCase().includes(q));
    box.querySelector("tbody").innerHTML=fs.map(f=>"<tr>"+cols.map(c=>`<td class="${c.num?"num":""}">${c.h?c.h(f):esc(c.v(f)??"–")}</td>`).join("")+"</tr>").join("")||`<tr><td colspan="${cols.length}" class="mut">Sin registros.</td></tr>`;
    box.querySelector(".n").textContent=`${fs.length} de ${filas.length}`};
  box.innerHTML=`<div class="tools" ${o.simple?'style="display:none"':""}><input placeholder="Buscar…" aria-label="Buscar"><span class="n"></span><button type="button">⭳ CSV</button></div><div class="tbl" tabindex="0"><table class="${o.simple?"min":""}"><thead>${o.grp||""}<tr>${cols.map(c=>`<th class="${c.num?"num":""}">${c.t}</th>`).join("")}</tr></thead><tbody></tbody></table></div>`;
  box.querySelector("input").oninput=e=>{q=e.target.value.toLowerCase();pintar()};
  box.querySelector("button").onclick=()=>{const c=x=>{const t=String(x??"").replace(/"/g,'""');return /[",;\n]/.test(t)?`"${t}"`:t};
    const txt="﻿"+[cols.map(k=>c(k.t)).join(";"),...filas.map(f=>cols.map(k=>{const v=k.v(f);return c(typeof v==="number"?String(v).replace(".",","):v)}).join(";"))].join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));a.download=`${id}.csv`;a.click()};
  pintar()}

/* ---------- datos derivados ---------- */
function mantMes(){const PM=D.prog_mensual||{},min=+(C.mantenimientos_mw_minimo??20),g={},mes=PM.mes||D.dia.slice(0,7);
  const nD=new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate();
  (PM.regs||[]).filter(r=>(r.mw||0)>=min).forEach(r=>{const k=r.ubicacion+"|"+r.equipo;const x=g[k]||(g[k]={c:r.ubicacion,u:r.equipo,mw:0,dsl:r.diesel,dias:new Set(),sigue:false});
    x.mw=Math.max(x.mw,r.mw);const a=new Date(r.inicio),b=new Date(new Date(r.final||r.inicio).getTime()-6e4);

    {type:"line",label:"Socabaya",data:dd.map(d=>(CV.diario["Socabaya 220"]||{})[d]??null),borderColor:css("--navy"),backgroundColor:css("--navy"),borderWidth:2,pointRadius:0,tension:.25,order:0},
    ...(fut.length?[{type:"line",label:"Sta. Rosa · proyectado",data:dd.map(d=>d===D.dia?D.cmg_diario[SR][d]:d>D.dia?prj[SR][d]:null),borderColor:css("--s8"),borderDash:[6,4],borderWidth:2,pointRadius:0,order:0}]:[])]},options:o1,plugins:[etq]});
  if(D.demanda_hist){const H=D.demanda_hist,ms=Array.from({length:H.mes},(_,i)=>i+1);
    const va=ms.map(m=>m===H.mes?H.mtd_gwh[H.ant]/1e3:(H.mensual[H.ant][m]??null)),vb=ms.map(m=>H.mensual[H.act][m]??null);
    const lb={id:"lb",afterDatasetsDraw(c){const x=c.ctx;x.save();x.font="700 10.5px Inter,sans-serif";x.fillStyle=css("--text");x.textAlign="center";const m=c.getDatasetMeta(1);
      m.data.forEach((b,i)=>{if(va[i]&&vb[i]){const p=(vb[i]/va[i]-1)*100;x.fillText(`${f1(p)}%`,b.x-b.width/2,Math.min(b.y,c.getDatasetMeta(0).data[i].y)-6)}});x.restore()}};
    const o=base("TWh");o.layout={padding:{top:16}};o.plugins.tooltip.callbacks.label=c=>`${c.dataset.label}: ${f2(c.parsed.y)} TWh`;
    graf("#c-dem",{type:"bar",data:{labels:ms.map(m=>MESL[m-1]+(m===H.mes?"*":"")),datasets:[{label:String(H.ant),data:va,backgroundColor:css("--teal"),borderRadius:3},{label:String(H.act),data:vb,backgroundColor:css("--s1"),borderRadius:3}]},options:o,plugins:[lb]})}
  {const lb={id:"lb2",afterDatasetsDraw(c){const x=c.ctx;x.save();x.font="700 10.5px Inter,sans-serif";x.textAlign="center";
      [0,1].forEach(k=>{const m=c.getDatasetMeta(k);m.data.forEach((b,i)=>{const v=c.data.datasets[k].data[i];if(fin(v)){x.fillStyle=css(k?"--naranja":"--navy");x.fillText(f0(v),b.x,b.y-4)}})});x.restore()}};
    const o=base("USD/MWh");o.layout={padding:{top:14}};o.plugins.tooltip.callbacks.label=c=>{const r=real[c.dataIndex];return c.datasetIndex&&r?`Real: ${f1(r.v)} (${r.auto?"COES"+(r.parcial?", mes en curso":""):"cargado"})`:`${c.dataset.label}: ${f1(c.parsed.y)}`};
    graf("#c-cpr",{type:"bar",data:{labels:meses.map(mLab),datasets:[{label:"Proyectado",data:proy,backgroundColor:css("--navy"),borderRadius:3},
      {label:"Real",data:real.map(x=>x?x.v:null),backgroundColor:real.map(x=>x&&x.parcial?css("--naranja")+"88":css("--naranja")),borderRadius:3}]},options:o,plugins:[lb]})}
  if(prj&&prj[SR]&&$("#c-pry")){const ds=Object.keys(prj[SR]).sort(),o=base("USD/MWh");o.plugins.tooltip.callbacks.title=it=>it[0].label;
    graf("#c-pry",{type:"bar",data:{labels:ds.map(ddmm),datasets:[{label:"Proyectado (YUPANA)",data:ds.map(d=>prj[SR][d]),backgroundColor:css("--navy")+"aa",borderRadius:3},{type:"line",label:"Ejecutado",data:ds.map(d=>d<=D.dia?D.cmg_diario[SR][d]??null:null),borderColor:css("--naranja"),backgroundColor:css("--naranja"),borderWidth:2.4,pointRadius:3}]},options:o})}
  {const R=resSemana();if(R&&$("#c-res")){const DS=["dom","lun","mar","mié","jue","vie","sáb"];
    const lab=R.rs.map(r=>{const d=new Date(r[0]);return `${DS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1} ${r[0].slice(11,16)}`});
    const o=base("MW");o.scales.y.beginAtZero=true;const ini=i=>R.rs[i]&&R.rs[i][0].endsWith("T00:30");
    o.scales.x.ticks={color:css("--text-2"),autoSkip:false,maxRotation:0,callback:(v,i)=>ini(i)?lab[i].slice(0,-6):null};
    o.scales.x.grid={color:c=>ini(c.index)?css("--grid"):"transparent",drawTicks:false};
    o.plugins.tooltip.callbacks={title:it=>lab[it[0].dataIndex]+" h",label:c=>`${c.dataset.label}: ${f0(c.parsed.y)} MW`};
    if(VRF)o.scales.y2={position:"right",beginAtZero:true,grid:{display:false},border:{display:false},ticks:{color:css("--text-2")},title:{display:true,text:"Reserva fría térmica (MW)",color:css("--text-2")}};
    const verde="#22c55e";
    graf("#c-res",{type:"line",data:{labels:lab,datasets:[
      {label:"Reserva eficiente gas",data:R.rs.map(r=>r[3]),stepped:true,fill:true,borderColor:"#16a34a",backgroundColor:c=>{const{ctx,chartArea}=c.chart;if(!chartArea)return verde+"55";const g=ctx.createLinearGradient(0,chartArea.top,0,chartArea.bottom);g.addColorStop(0,verde+"aa");g.addColorStop(1,verde+"22");return g},borderWidth:1.6,pointRadius:0},
      ...(R.rs.some(r=>fin(r[4])&&r[4]>0)?[{label:"Reserva eficiente carbón",data:R.rs.map(r=>r[4]),stepped:true,borderColor:"#6b7280",borderWidth:1.4,pointRadius:0}]:[]),
      ...(VRF?[{label:"Reserva fría térmica",data:R.rs.map(r=>r[1]),yAxisID:"y2",stepped:true,borderColor:css("--navy"),borderDash:[5,4],borderWidth:1.6,pointRadius:0}]:[])]},options:o})}}
  const sem_=(id,A,un)=>{const ys=Object.keys(A).sort().slice(-4),est=ANIOC.slice(4-ys.length);const o=base(un);
    o.scales.x={type:"linear",min:1,max:53,grid:{color:css("--grid")},border:{display:false},ticks:{color:css("--text-2"),stepSize:3},title:{display:true,text:"Semanas",color:css("--text-2")}};o.scales.y.beginAtZero=true;o.interaction={mode:"nearest",axis:"x",intersect:false};
    o.plugins.tooltip.callbacks={title:it=>`Semana ${it[0].parsed.x}`,label:t=>`${t.dataset.label}: ${f1(t.parsed.y)} ${un}`};
    graf(id,{type:"scatter",data:{datasets:ys.map((y,j)=>({label:y,data:Object.entries(A[y]).map(([k,v])=>({x:+k,y:v})).sort((p,q)=>p.x-q.x),showLine:true,borderColor:css(est[j]),backgroundColor:css(est[j]),borderWidth:j===ys.length-1?2.8:1.6,pointRadius:2}))},options:o})};
  ES.cuencas.filter(c=>c.caudal).forEach((c,i)=>sem_("#c-q"+i,c.caudal.anios,"m³/s"));
  ES.cuencas.forEach((c,i)=>sem_("#c-v"+i,c.anios,"hm³"));
  if(MTM==="dia"&&$("#c-mgd")){const G=ganttDia(),o=base("");o.indexAxis="y";o.interaction={mode:"nearest",intersect:true};o.plugins.legend.display=false;o.layout={padding:{top:16}};
    o.scales={x:{type:"linear",min:0,max:24,grid:{color:css("--grid")},border:{display:false},ticks:{color:css("--text-2"),stepSize:innerWidth<700?6:2,maxRotation:0,callback:v=>String(v).padStart(2,"0")+":00"}},
      y:{type:"category",labels:G.filas,grid:{display:false},border:{display:false},ticks:{color:css("--text"),autoSkip:false,font:{size:11.5}}}};
    o.plugins.tooltip.callbacks={title:it=>it[0].raw.r.descripcion.slice(0,90),label:it=>{const r=it.raw.r;return `${r.tecnologia||""} · ${f1(r.mw)} MW · ${per(r,D.hoy)}${r.estado?" · "+r.estado:""}`}};
    const ahora={id:"ahora",afterDatasetsDraw(c){const n=new Date(D.generado),v=(n-new Date(D.hoy+"T00:00"))/36e5;if(v<0||v>24)return;const x=c.ctx,px=c.scales.x.getPixelForValue(v);x.save();x.strokeStyle=css("--naranja");x.lineWidth=2;x.beginPath();x.moveTo(px,c.chartArea.top);x.lineTo(px,c.chartArea.bottom);x.stroke();
      x.fillStyle=css("--naranja");x.font="600 10.5px Inter,sans-serif";x.textAlign="center";x.fillText("ahora "+n.toTimeString().slice(0,5),px,c.chartArea.top-5);x.restore()}};
    graf("#c-mgd",{type:"bar",data:{datasets:[{data:G.pts,backgroundColor:G.pts.map(p=>p.r.diesel?"#b8bec9":(TECC[p.r.tecnologia]||"#94a3b8")),borderRadius:3,borderSkipped:false,barPercentage:.7,categoryPercentage:.9}]},options:o,plugins:[ahora]})}
  if(MTM==="mes"&&$("#c-mmg")){const G=ganttMes();const o=base("");o.indexAxis="y";o.interaction={mode:"nearest",intersect:true};o.plugins.legend.display=false;o.layout={padding:{top:16}};
    const dl=v=>{const d=new Date(G.a.getTime()+v*864e5);return `${d.getDate()} ${MESC[d.getMonth()]}`};
    o.scales={x:{type:"linear",min:0,max:G.n,grid:{color:css("--grid")},border:{display:false},ticks:{color:css("--text-2"),stepSize:innerWidth<700?7:2,maxRotation:0,callback:v=>v<G.n?dl(v):""}},
      y:{type:"category",labels:G.filas,grid:{display:false},border:{display:false},ticks:{color:css("--text"),autoSkip:false,font:{size:11.5}}}};
    o.plugins.tooltip.callbacks={title:it=>it[0].raw.r.descripcion.slice(0,90),label:it=>{const r=it.raw.r;return `${r.tecnologia||""} · ${f1(r.mw)} MW · ${ddmm(r.inicio)} ${r.inicio.slice(11,16)} → ${ddmm(r.final||"")} ${(r.final||"").slice(11,16)}`}};
    const corte={id:"corte",afterDatasetsDraw(c){const v=(new Date(D.hoy+"T00:00")-G.a)/864e5;if(v<0||v>G.n)return;const x=c.ctx,px=c.scales.x.getPixelForValue(v);x.save();x.strokeStyle=css("--naranja");x.lineWidth=2;x.beginPath();x.moveTo(px,c.chartArea.top);x.lineTo(px,c.chartArea.bottom);x.stroke();
      x.fillStyle=css("--naranja");x.font="600 10.5px Inter,sans-serif";x.textAlign="center";x.fillText("hoy "+ddmm(D.hoy),px,c.chartArea.top-5);x.restore()}};
    graf("#c-mmg",{type:"bar",data:{datasets:[{data:G.pts,backgroundColor:G.pts.map(p=>p.r.diesel?"#b8bec9":(TECC[p.r.tecnologia]||"#94a3b8")),borderRadius:3,borderSkipped:false,barPercentage:.7,categoryPercentage:.9}]},options:o,plugins:[corte]})}
  // sección activa en el menú
  const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}),{rootMargin:"-40% 0px -55% 0px"});
  document.querySelectorAll("section.sec").forEach(s=>obs.observe(s))}

function cargar(){$("#upd").disabled=true;$("#upd").textContent="⟳ Actualizando…";
  Promise.all([fetch("datos.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}),fetch("comercial.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).catch(()=>({}))])
   .then(([d,c])=>{D=d;C=c||{};render()})
   .catch(()=>{$("#main").innerHTML='<div class="estado par">No se pudieron cargar los datos publicados (datos.json). Intenta de nuevo en unos minutos.</div>'})
   .finally(()=>{$("#upd").disabled=false;$("#upd").textContent="⟳ Actualizar"})}
$("#upd").onclick=cargar;
try{const t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("#tema").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("tema",r.dataset.theme)}catch(e){};if(D)render()};
cargar();
</script>
