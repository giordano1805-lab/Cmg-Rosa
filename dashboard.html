<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor SEIN Huanchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f7; --surface:#fff; --surface-2:#f0f2f5; --border:#e2e4e8;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7c7b77; --brand:#001a6f; --brand2:#001a6f; --naranja:#ff5716; --amarillo:#ffb210;
  --s1:#2b4fd1; --s2:#f0590f; --s3:#e9a300; --s4:#1baf7a; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s9:#8f1d2c; --s10:#b0457a; --base:#6f8bf5; --linea:#001a6f;
  --navy:#1d3a8a; --grid:rgba(0,0,0,.07); --bad:#c5221f; --good:#137333;
  --info-bg:#eaf0ff; --info-tx:#001a6f; --warn-bg:#fff1e8; --warn-tx:#8a2d00; --shadow:0 1px 2px rgba(16,24,40,.05);
  --h1:#001a6f;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#2f2f2c;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#9a9993; --brand:#001a6f; --brand2:#8fa6ff; --naranja:#ff6a2e; --amarillo:#ffb210;
    --s1:#6f8bf5; --s2:#ff7a3d; --s3:#d1a21c; --s4:#26b583; --s5:#d55181; --s6:#2e9e2e; --s7:#9085e9; --s8:#ee6b6b; --s9:#c25a66; --s10:#c86a9a; --base:#9fb1f7; --linea:#f0efec;
    --navy:#9fb1f7; --grid:rgba(255,255,255,.08); --bad:#f28b82; --good:#81c995;
    --info-bg:#1b2547; --info-tx:#dbe3ff; --warn-bg:#3a2216; --warn-tx:#ffc9a8; --shadow:none; --h1:#c9d3ff;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#2f2f2c;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#9a9993; --brand:#001a6f; --brand2:#8fa6ff; --naranja:#ff6a2e; --amarillo:#ffb210;
  --s1:#6f8bf5; --s2:#ff7a3d; --s3:#d1a21c; --s4:#26b583; --s5:#d55181; --s6:#2e9e2e; --s7:#9085e9; --s8:#ee6b6b; --s9:#c25a66; --s10:#c86a9a; --base:#9fb1f7; --linea:#f0efec;
  --navy:#9fb1f7; --grid:rgba(255,255,255,.08); --bad:#f28b82; --good:#81c995;
  --info-bg:#1b2547; --info-tx:#dbe3ff; --warn-bg:#3a2216; --warn-tx:#ffc9a8; --shadow:none; --h1:#c9d3ff;
}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:2px solid var(--naranja);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header{background:#fff;color:var(--brand);padding:12px 16px;border-bottom:4px solid transparent;border-image:linear-gradient(90deg,var(--naranja),var(--amarillo)) 1}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0}
header img{height:40px;display:none}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;color:var(--brand);padding-left:14px;border-left:1px solid #d9dce6}
header .meta{margin-left:auto;font-size:12.5px;color:#52514e;text-align:right}
header .btn{background:var(--naranja);color:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}
header button{background:transparent;border:1px solid #c9cde0;color:var(--brand);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px}
nav{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav [role=tab]{border:0;background:none;color:var(--text-2);font:inherit;font-weight:500;padding:12px 11px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav [role=tab][aria-selected=true]{color:var(--text);font-weight:600;border-color:var(--naranja)}
#secsel{display:none;width:100%;margin:8px 0;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:600;min-height:44px}
@media (max-width:700px){nav [role=tab]{display:none}#secsel{display:block}}
main{padding:18px 0 40px}
section[role=tabpanel]{display:none} section.on{display:block}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g64{grid-template-columns:minmax(0,62fr) minmax(0,38fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700;color:var(--h1)}
.card h2 small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin:2px 0 0}
/* encabezado de sección */
.shd{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;justify-content:space-between}
.shd h1{margin:0;font-size:26px;color:var(--h1);letter-spacing:-.3px;line-height:1.15}
.shd .subt{color:var(--text-2);font-size:14.5px;margin-top:3px}
.shd .ctl{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.shd .ctl .fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.fch{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
/* franja de conclusión */
.concl2{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:10px;background:var(--info-bg);color:var(--info-tx);font-weight:600;font-size:15.5px;line-height:1.45}
.concl2 svg{flex:none;margin-top:2px}
.concl2.neutra{background:var(--surface-2);color:var(--text-2);font-weight:500}
/* tarjetas de indicadores */
.kc{display:flex;gap:12px;align-items:flex-start}
.kc .ki{flex:none;color:var(--naranja);margin-top:2px}
.kc .lbl{color:var(--text-2);font-size:13px;font-weight:600}
.kc .val{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:2px 0;color:var(--h1);line-height:1.15;font-variant-numeric:tabular-nums}
.kc .val small{font-size:13.5px;font-weight:500;color:var(--text-2);margin-left:4px;letter-spacing:0}
.kc .val.txt{font-size:22px}
.kc .sub{font-size:12.5px;color:var(--text-2);margin-top:3px}
.kc.sel{border-color:var(--naranja);box-shadow:0 0 0 1px var(--naranja) inset}
.kpi .lbl{color:var(--text-2);font-size:12.5px}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:2px 0}
.kpi .val small{font-size:13px;font-weight:500;color:var(--text-2);margin-left:3px}
.kpi .sub{font-size:12.5px;color:var(--text-2)}
.ofk .kpi.big .val{font-size:38px}
/* etiquetas */
.chip{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.pos{background:rgba(27,175,122,.14);color:#0f7a54}.chip.neg{background:rgba(240,89,15,.13);color:#c2410c}
.chip.neu,.chip.nd{background:var(--grid);color:var(--text-2)}
.chip.sube{background:rgba(43,79,209,.10);color:#2340b0}.chip.baja{background:rgba(43,79,209,.10);color:#2340b0}
.chip.par{background:var(--warn-bg);color:var(--warn-tx)}
.chip.est{background:var(--surface-2);color:var(--text-2);font-weight:600}
.chip.fs{background:rgba(197,34,31,.12);color:var(--bad)}
:root[data-theme="dark"] .chip.pos{color:#4fd6a2}:root[data-theme="dark"] .chip.neg{color:#ff9a63}:root[data-theme="dark"] .chip.sube,:root[data-theme="dark"] .chip.baja{color:#b7c5ff}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .chip.pos{color:#4fd6a2}:root:where(:not([data-theme="light"])) .chip.neg{color:#ff9a63}:root:where(:not([data-theme="light"])) .chip.sube,:root:where(:not([data-theme="light"])) .chip.baja{color:#b7c5ff}}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.up{color:var(--bad)} .down{color:var(--good)}
.mut{color:var(--muted);font-size:12.5px}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.pie{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:space-between;color:var(--muted);font-size:11.5px;border-top:1px solid var(--border);padding-top:8px}
.pie b{color:var(--text-2);font-weight:600}
/* gráficos */
.chart{position:relative;height:300px} .chart.tall{height:360px} .chart.sm{height:170px} .chart.xs{height:150px}
.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2);margin:-4px 0 6px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lgd i.sq{border-radius:2px}.lgd i.hol{background:transparent!important;border:2px solid var(--muted)}
/* segmentados y botones */
.seg{display:inline-flex;gap:4px;padding:3px;border-radius:9px;background:var(--grid);flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--text-2);font:inherit;font-size:13px;padding:6px 12px;border-radius:7px;cursor:pointer;min-height:32px}
.seg button[aria-pressed=true]{background:var(--naranja);color:#fff;font-weight:600}
.seg.sm button{font-size:12px;padding:4px 10px;min-height:28px}
.tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font:inherit;font-size:12.5px;padding:5px 10px;border-radius:999px;cursor:pointer;min-height:30px}
.tg[aria-pressed=true]{border-color:var(--naranja);color:var(--text);font-weight:600}
.tg .dot{margin:0}
.tg[aria-pressed=false] .dot{background:transparent!important;border:2px solid var(--muted)}
select.sel,input.sel{border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;min-height:34px}
.lnk{border:0;background:none;color:var(--naranja);font:inherit;font-weight:600;font-size:13px;cursor:pointer;padding:4px 0;text-decoration:none}
.btn2{margin-top:10px;border:1px solid var(--border);background:var(--surface);color:var(--brand2);font:inherit;font-weight:600;font-size:13.5px;padding:8px 14px;border-radius:8px;cursor:pointer}
/* desplegables */
details.acc{background:var(--surface);border:1px solid var(--border);border-radius:12px}
details.acc>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;min-height:24px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc .ic{color:var(--muted);display:flex}details.acc .t{font-weight:600;color:var(--h1);flex:1}
details.acc .chev{font-size:22px;color:var(--muted);transition:transform .15s;line-height:1}
details.acc[open] .chev{transform:rotate(90deg)}
details.acc .accb{padding:0 14px 14px}
.accs{display:grid;gap:8px}
.h3{margin:8px 0 0;font-size:15px;color:var(--h1)}
/* tablas */
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tools input{flex:1;min-width:160px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}
.tools .n{color:var(--muted);font-size:12.5px}
.tools .csv{border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:7px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.tbl{overflow:auto;max-height:520px;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:12.5px}
table.min{min-width:0}
td.desc{min-width:260px}
td.cort{white-space:nowrap}
th,td{padding:7px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border)}
th{position:sticky;top:0;background:var(--surface-2);font-weight:600;color:var(--text-2);white-space:nowrap}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--naranja)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:var(--surface-2)}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--text-2)}
.tag.f{background:rgba(197,34,31,.12);color:var(--bad)}
.tag.rf{background:var(--s9);color:#fff}
a{color:var(--s1)}
/* estados */
.estado{display:flex;gap:8px;align-items:center;padding:12px 14px;border-radius:10px;border:1px dashed var(--border);color:var(--text-2);font-size:13px;background:var(--surface)}
.estado.parcial{border-style:solid;border-color:transparent;background:var(--warn-bg);color:var(--warn-tx)}
.estado.error{border-style:solid;border-color:var(--bad);color:var(--bad)}
.cargando{padding:40px 0;text-align:center;color:var(--muted)}
/* listas: vigilar, saber, hitos, cronología */
.lst{display:grid;gap:0}
.it{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.it:last-child{border-bottom:0}
.it .ii{flex:none;color:var(--naranja);margin-top:2px}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;color:var(--h1);font-size:13.5px}
.it .tx span{color:var(--text-2);font-size:12.5px}
.it .hr{flex:none;text-align:right;font-size:12px;color:var(--text-2);white-space:nowrap}
.it .hr b{display:block;color:var(--text);font-size:12.5px}
.saber3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.saber3>div{padding:4px 16px;border-left:1px solid var(--border)}
.saber3>div:first-child{border-left:0;padding-left:0}
.saber3 .t{font-weight:700;color:var(--h1);font-size:13.5px;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.saber3 .t svg{color:var(--naranja)}
.saber3 p{margin:0;font-size:13px;color:var(--text-2)}
.saber3 button{margin-top:4px}
.alertas{display:grid;gap:6px}
.alerta{display:block;padding:7px 10px;border-radius:8px;border-left:4px solid var(--muted);background:var(--surface);color:var(--text);text-decoration:none;font-size:13px;border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.alerta b{margin-right:6px}.alerta span{color:var(--text-2)}
.alerta.alta{border-left-color:#c5221f}.alerta.media{border-left-color:var(--naranja)}
.strip{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center}
.strip .lbl{font-size:12px;color:var(--text-2)}.strip b{font-size:17px}
.strip .tt{font-weight:700;color:var(--h1);display:flex;gap:8px;align-items:center}
.bar{height:12px;border-radius:6px;background:var(--grid);overflow:hidden;flex:1;min-width:60px}
.bar span{display:block;height:100%;border-radius:6px}
.brow{display:grid;grid-template-columns:110px minmax(0,1fr) 120px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.brow .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.cards5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.cards5 button{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:0}
.cards5 button[aria-pressed=true]{border-color:var(--naranja);box-shadow:0 0 0 1px var(--naranja) inset}
.cards5 button:focus-visible{outline:2px solid var(--naranja);outline-offset:2px}
.cards5 .n{font-weight:700;color:var(--h1)}
.cards5 .v{font-size:22px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.cards5 .v small{font-size:12.5px;font-weight:500;color:var(--text-2);margin-left:3px}
.cards5 .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.cent ul{margin:6px 0 10px;padding-left:16px;font-size:12.5px;color:var(--text-2)}.cent li{margin:2px 0}
.cent .tot{display:inline-block;background:#fff3c4;color:#001a6f;font-weight:700;font-size:12.5px;padding:3px 8px;border-radius:6px}
.embk{display:flex;gap:22px;margin-bottom:8px;font-size:15px;flex-wrap:wrap}.embk .lbl{font-size:12px;color:var(--text-2)}
.centt{font-weight:600;color:var(--h1)}
.blq{margin-bottom:8px}.blq .lbl{margin-bottom:2px}
ul.bul{margin:0;padding-left:18px} ul.bul li{margin:4px 0}
details.det summary{cursor:pointer;font-weight:600;color:var(--text-2)}
.ofgr{display:grid;grid-template-columns:minmax(0,56fr) minmax(0,44fr);gap:16px}
.perio{font-size:12.5px;color:var(--text-2)}
.seg.of button.on{background:var(--naranja);color:#fff;font-weight:600}
.gcol{display:grid;gap:4px}
.grp td{background:var(--surface-2)}
@media (max-width:900px){.g64{grid-template-columns:1fr}.cards5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.g3{grid-template-columns:1fr}.ofgr{grid-template-columns:1fr}.shd .ctl{align-items:flex-start}.shd .ctl .fila{justify-content:flex-start}.ofk .kpi.big .val{font-size:30px}.concl2{font-size:14.5px}.saber3{grid-template-columns:1fr}.saber3>div{border-left:0;padding:8px 0;border-top:1px solid var(--border)}.saber3>div:first-child{border-top:0}}
@media (max-width:600px){header img{height:30px}header h1{font-size:15px;border:0;padding-left:0;width:100%}header .meta{margin-left:0;text-align:left}.shd h1{font-size:22px}.kc .val{font-size:25px}.chart{height:250px}.chart.tall{height:290px}.cards5{grid-template-columns:repeat(2,minmax(0,1fr))}.brow{grid-template-columns:80px minmax(0,1fr) 96px}.g2{grid-template-columns:1fr}}

/* ===== capa visual: profundidad, transparencias y texturas ===== */
:root{--card-b:rgba(0,26,111,.09);--sombra:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(0,26,111,.14);--tinte:rgba(255,87,22,.10);--tinte2:rgba(0,26,111,.06)}
:root[data-theme="dark"]{--card-b:rgba(255,255,255,.07);--sombra:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px -14px rgba(0,0,0,.7);--tinte:rgba(255,106,46,.16);--tinte2:rgba(143,166,255,.10)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){--card-b:rgba(255,255,255,.07);--sombra:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px -14px rgba(0,0,0,.7);--tinte:rgba(255,106,46,.16);--tinte2:rgba(143,166,255,.10)}}
body{background:radial-gradient(1200px 420px at 85% -120px,rgba(255,178,16,.10),transparent 60%),radial-gradient(900px 380px at -10% -80px,rgba(0,26,111,.07),transparent 60%),var(--bg);background-attachment:fixed}
header{box-shadow:0 1px 0 rgba(0,26,111,.06)}
nav{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
nav [role=tab]{border-radius:8px 8px 0 0;transition:color .15s,background .15s}
nav [role=tab]:hover{background:var(--tinte2);color:var(--text)}
.card,details.acc,.cards5 button{border-color:var(--card-b);box-shadow:var(--sombra);border-radius:14px}
.card{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 92%,var(--bg)))}
.card h2{letter-spacing:-.1px}
.shd{padding-top:4px}
.shd h1{position:relative;padding-top:12px}
.shd h1::before{content:"";position:absolute;left:0;top:0;width:34px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--naranja),var(--amarillo))}
.fch{border-color:var(--card-b);box-shadow:var(--sombra)}
.concl2{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--tinte),rgba(255,178,16,.07) 55%,transparent),var(--surface);color:var(--h1);border:1px solid rgba(255,87,22,.22);border-left:4px solid var(--naranja);box-shadow:var(--sombra)}
.concl2 svg{color:var(--naranja)}
.concl2.neutra{background:var(--surface-2);border-color:var(--card-b);border-left-color:var(--muted);color:var(--text-2)}
.concl2.neutra svg{color:var(--muted)}
.kc .ki{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--tinte);color:var(--naranja);margin-top:0;box-shadow:inset 0 0 0 1px rgba(255,87,22,.15)}
.kc{position:relative;overflow:hidden}
.kc::after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,178,16,.10),transparent 70%);pointer-events:none}
.kc .val{background:linear-gradient(180deg,var(--h1),color-mix(in srgb,var(--h1) 75%,#4d6bd6));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kc .val small{-webkit-text-fill-color:var(--text-2)}
.chip{border:1px solid transparent;backdrop-filter:blur(2px)}
.chip.sube,.chip.baja{background:var(--tinte2);border-color:rgba(43,79,209,.18)}
.chip.par{border-color:rgba(255,87,22,.25)}
.chip.fs{border-color:rgba(197,34,31,.22)}
.seg{background:var(--tinte2);box-shadow:inset 0 1px 2px rgba(0,26,111,.08)}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#ff6a2e,var(--naranja));box-shadow:0 2px 6px -2px rgba(255,87,22,.55)}
.tg{border-color:var(--card-b);transition:all .15s}
.tg[aria-pressed=true]{background:var(--tinte);border-color:rgba(255,87,22,.45)}
details.acc>summary{transition:background .15s;border-radius:14px}
details.acc>summary:hover{background:var(--tinte2)}
details.acc .ic{width:32px;height:32px;border-radius:9px;background:var(--tinte2);color:var(--h1);display:grid;place-items:center}
details.acc[open]>summary{border-bottom:1px solid var(--card-b);border-radius:14px 14px 0 0;margin-bottom:12px}
.tbl{border-color:var(--card-b);border-radius:10px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;background:color-mix(in srgb,var(--surface-2) 85%,var(--tinte2))}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface) 96%,var(--tinte2))}
tr:hover td{background:var(--tinte2)!important}
.it{border-bottom-style:dashed;border-color:var(--card-b)}
.it .ii{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--tinte);margin-top:0}
.cards5 button{transition:transform .12s,box-shadow .15s}
.cards5 button:hover{transform:translateY(-1px)}
.cards5 button[aria-pressed=true]{background:linear-gradient(180deg,var(--tinte),transparent 70%),var(--surface)}
.bar{background:var(--tinte2)}.bar span{background-image:linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.25))}
.strip{background:linear-gradient(90deg,var(--tinte2),transparent 60%),var(--surface)}
.estado{border-color:var(--card-b)}
.alerta{border-color:var(--card-b);box-shadow:var(--sombra)}
.pie{border-top:1px dashed var(--card-b)}
.btn2{border-color:var(--card-b);box-shadow:var(--sombra)}
</style>
</head>
<body>
<header><div class="wrap">
  <img id="logo" src="logo.png" alt="Hidroeléctrica Huanchor" onload="this.style.display='block'">
  <h1>Monitor diario del SEIN</h1>
  <div class="meta" id="meta" aria-live="polite">Cargando…</div>
  <a id="pdf" class="btn" href="#" target="_blank" style="display:none">Descargar PDF</a>
  <button id="tema" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema claro u oscuro">Tema</button>
</div></header>
<nav aria-label="Secciones"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="main"><div class="cargando" role="status">Cargando datos del SEIN…</div></main>

<script>
const SECC=[["resumen","Resumen"],["huanchor","Huanchor"],["precios","Precios"],["oferta","Oferta y demanda"],["embalses","Embalses"],
["prog","Programación"],["mes","Mantenimiento del mes"],["indisp","Indisponibilidades"],["trans","Transmisión y eventos"]];
const $=s=>document.querySelector(s);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fin=v=>v!=null&&isFinite(v);
const nf=(d0,d1)=>v=>fin(v)?Number(v).toLocaleString("es-PE",{minimumFractionDigits:d0,maximumFractionDigits:d1}):"–";
const f2=nf(2,2),f1=nf(1,1),f0=nf(0,0);
const romanos=s=>String(s??"").replace(/\b(ii|iii|iv|vi|vii|viii|ix|xi|xii)\b/gi,m=>m.toUpperCase());
const tit=s=>romanos((s||"").toLowerCase().replace(/(^|[\s.(\/-])([a-záéíóúñü])/g,(m,a,b)=>a+b.toUpperCase()));
const hm=s=>{if(!s)return"";const d=new Date(s);return d.toTimeString().slice(0,5)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MESC=["ene","feb","mar","abr","may","jun","jul","ago","set","oct","nov","dic"];
const MESN=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
const fL=s=>s?`${+s.slice(8,10)} ${MESC[+s.slice(5,7)-1]} ${s.slice(0,4)}`:"";            // 25 oct 2026
const fN=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:"";                       // 25/10/2026
const ddmm=s=>s?s.slice(8,10)+"/"+s.slice(5,7):"";
const sumD=(s,k)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+k);return d.toISOString().slice(0,10)};
const pct=(a,b)=>fin(a)&&fin(b)&&b!==0?(a/b-1)*100:null;
const lab48=Array.from({length:48},(_,i)=>`${String(Math.floor(i/2)).padStart(2,"0")}:${i%2?"30":"00"}`);           // inicio de cada media hora
const labFin=Array.from({length:48},(_,k)=>{const m=(k+1)*30;return `${String(Math.floor(m/60)).padStart(2,"0")}:${m%60?"30":"00"}`}); // fin: 00:30 … 24:00
// Horario de un registro: 24:00 cuando termina a las 00:00 del día siguiente
const per=(r,dia)=>{dia=dia||D.dia_ieod||D.dia;const sig=sumD(dia,1);
  const fmt=(s,fin)=>{if(!s)return"";const fecha=s.slice(0,10),t=s.slice(11,16);
    if(fin&&fecha===sig&&t==="00:00")return"24:00";return fecha===dia?t:`${fecha.slice(8,10)}/${fecha.slice(5,7)} ${t}`};
  return `${fmt(r.inicio)}–${fmt(r.final,true)}`};
// MW indisponibles en el instante t sin doble conteo: por central se toma el mayor entre el registro "CENTRAL"
// y la suma de sus unidades (cada unidad con su máximo), nunca la suma de ambos.
function mwActivo(regs,t,filtro){const por={};
  regs.forEach(r=>{if(filtro&&!filtro(r))return;const i=new Date(r.inicio),f=new Date(r.final||r.inicio);if(!(i<=t&&f>t))return;
    const c=por[r.ubicacion]||(por[r.ubicacion]={cen:0,uni:{}});
    if((r.equipo||"").toUpperCase()==="CENTRAL")c.cen=Math.max(c.cen,r.mw||0);else c.uni[r.equipo]=Math.max(c.uni[r.equipo]||0,r.mw||0)});
  return Object.values(por).reduce((a,c)=>a+Math.max(c.cen,Object.values(c.uni).reduce((x,y)=>x+y,0)),0)}
const activos=(regs,t)=>regs.filter(r=>new Date(r.inicio)<=t&&new Date(r.final||r.inicio)>t);
function perfil(regs,dia,filtro){const d0=new Date(dia+"T00:00");return lab48.map((_,k)=>mwActivo(regs,new Date(d0.getTime()+(k*30+15)*6e4),filtro))}
function mwDia(regs,dia,filtro){const p=perfil(regs,dia,filtro);return p.reduce((a,b)=>a+b,0)/48}
const lin=t=>{const m=String(t||"").match(/L-?\s?(\d{4}[A-Z]?)/i);if(!m)return t;const tr=(D.tramos||{})["L-"+m[1]];return tr&&!String(t).includes(tr)?`${t} (${tr})`:t};
const TECC={"Hídrica":"--s1","Gas natural":"--s2","Solar":"--s3","Eólica":"--s4","Biomasa":"--s7","Carbón":"--s5","Diésel":"--s8","Otra":"--muted"};
const TIPOC={prog:"--navy",forz:"--s2"};
const SERIE={"Santa Rosa 220":"--navy","Socabaya 220":"--naranja","Piura 220":"--s4"};
const BLOQ={"Punta (18-23 h)":"--s2","Media (6-18 h)":"--s3","Base (23-6 h)":"--base"};
const BLOQH={"Punta (18-23 h)":"18:00–23:00","Media (6-18 h)":"06:00–18:00","Base (23-6 h)":"23:00–06:00"};
const GEN={"Hídrica":"--s1","Gas natural":"--s2","Solar":"--s3","Eólica":"--s4","Carbón":"--muted","Biomasa":"--s7","Diésel/Residual":"--s8","Otros":"--muted","D2 Reserva Fría":"--s9","Diésel/Residual otras":"--s8"};
const corta=b=>String(b||"").replace(/ 220$/,"");
let D,charts=[],ACT="resumen";
const OPEN=new Set();
// estado de controles por pestaña
let HCF="Todas",HCU="GWh",OFM="mes",PRM="dia",PRA=false,EMM="sem",EMC=2,PGD=false,PGT=true,MSR="7d",MST="sd",MSQ="",ITM="max",TRS=null;
const PRS=new Set(["Santa Rosa 220","Socabaya 220","Piura 220"]);

/* ---------------- íconos ---------------- */
const P_={bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',chart:'<path d="M3 20h18M6 16v-5M11 16V7M16 16v-8M21 16V4"/>',
 line:'<path d="M3 3v18h18"/><path d="m7 15 4-5 4 3 5-7"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 alert:'<path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18h.01"/>',tag:'<path d="M20 12 12 20 3 11V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
 drop:'<path d="M12 3s7 7.5 7 12a7 7 0 0 1-14 0c0-4.5 7-12 7-12z"/>',tower:'<path d="M12 2 6 22M12 2l6 20M8 14h8M9.5 9h5M5 6h14"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',
 fuel:'<path d="M3 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18M3 22h12M6 7h6M15 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
 info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',wave:'<path d="M2 8c3-3 5 3 8 0s5 3 8 0 4 0 4 0M2 14c3-3 5 3 8 0s5 3 8 0 4 0 4 0"/>',
 flame:'<path d="M12 22c4 0 7-3 7-7 0-5-5-8-6-13-2 3-3 5-3 7-1-1-2-2-2-4-2 2-3 5-3 7 0 5 3 10 7 10z"/>',
 net:'<circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5 6.5 17M12 11.5l5.5 5.5"/>',
 layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',dem:'<path d="M3 20h18M6 16v-5M11 16V7M16 16v-8M21 16V4"/>',
 tec:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',ter:'<path d="M12 22c4 0 7-3 7-7 0-5-5-8-6-13-2 3-3 5-3 7-1-1-2-2-2-4-2 2-3 5-3 7 0 5 3 10 7 10z"/>'};
const ico=(k,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P_[k]||P_.info}</svg>`;

/* ---------------- componentes compartidos ---------------- */
// encabezado de sección con fecha y controles
const hdr=(t,sub,ctl="")=>`<div class="shd"><div><h1>${t}</h1>${sub?`<div class="subt">${sub}</div>`:""}</div>${ctl?`<div class="ctl">${ctl}</div>`:""}</div>`;
// franja de conclusión (neutra si faltan datos)
const concl=(txt,neutra)=>txt?`<div class="concl2${neutra?" neutra":""}" role="note">${ico("info",20)}<span>${esc(txt)}</span></div>`:"";
// tarjeta de indicador
const kc=o=>`<div class="card kc${o.sel?" sel":""}">${o.ic?`<span class="ki">${ico(o.ic,24)}</span>`:""}<div style="min-width:0;flex:1">
  <div class="lbl">${o.lbl}</div><div class="val${o.txt?" txt":""}">${o.val}${o.un?`<small>${o.un}</small>`:""}</div>${o.sub?`<div class="sub">${o.sub}</div>`:""}</div></div>`;
// variación con signo, flecha y texto; sin color "bueno/malo" salvo que se pida
function chipV(v,txt,o={}){if(!fin(v))return `<span class="chip nd">${esc(o.nd||"sin comparación")}</span>`;
  const d=o.dec??(Math.abs(v)<10?1:0),s=Math.abs(v)<.05?"=":v>0?"▲ +":"▼ −",cls=o.color?(v>=0?"pos":"neg"):(v>=0?"sube":"baja");
  return `<span class="chip ${cls}">${s}${Math.abs(v).toFixed(d)}${o.un??"%"}${txt?" "+esc(txt):""}</span>`}
const chipP=t=>`<span class="chip par" title="Faltan datos en parte del período">${esc(t||"parcial")}</span>`;
// segmentado accesible
const seg=(lbl,ops,cur,fn,cls="")=>`<div class="seg ${cls}" role="group" aria-label="${lbl}">${ops.map(([k,n])=>`<button type="button" aria-pressed="${cur===k}" onclick="${fn}('${k}')">${n}</button>`).join("")}</div>`;
// contenedor de gráfico con resumen textual para lectores de pantalla
const cv=(id,resumen,h)=>`<div class="chart${h&&typeof h==="string"?" "+h:""}" ${typeof h==="number"?`style="height:${h}px"`:""}><canvas id="${id}" role="img" aria-label="${esc(resumen)}"></canvas></div>`;
const box=(t,sub,inner,extra="")=>`<div class="card" ${extra}><h2>${t}${sub?`<small>${sub}</small>`:""}</h2>${inner}</div>`;
// desplegable con estado recordado
const acc=(id,ic,t,cont,der="")=>`<details class="acc" id="${id}" ${OPEN.has(id)?"open":""}><summary><span class="ic">${ico(ic,18)}</span><span class="t">${t}</span>${der}<span class="chev" aria-hidden="true">›</span></summary><div class="accb">${cont}</div></details>`;
// estados de carga, error, parcial y vacío
const est=(tipo,msg)=>`<div class="estado ${tipo}" role="status">${ico(tipo==="error"?"alert":"info",18)}<span>${msg}</span></div>`;
const pie=(fuente,periodo)=>`<div class="pie"><span><b>Período:</b> ${periodo}</span><span><b>Fuente:</b> ${fuente}</span><span><b>Actualizado:</b> ${actTxt()}</span></div>`;
const actTxt=()=>D?new Date(D.generado).toLocaleString("es-PE",{dateStyle:"short",timeStyle:"short"})+" (hora de Lima)":"";
const lgd=items=>`<div class="lgd" aria-hidden="true">${items.map(([c,t,cl])=>`<span><i class="${cl||""}" style="background:${c}"></i>${t}</span>`).join("")}</div>`;
function abrirAcc(id,dest){const d=$("#"+id);if(!d)return;d.open=true;OPEN.add(id);setTimeout(()=>{dibujar();const t=$("#"+(dest||id));if(t)t.scrollIntoView({behavior:"smooth",block:"start"})},60)}
function ir(sec,acc_){ver(sec);if(acc_)setTimeout(()=>abrirAcc(acc_),30)}
function enlazarAcc(){document.querySelectorAll("details.acc").forEach(d=>{if(d._ok)return;d._ok=1;d.addEventListener("toggle",()=>{if(d.open){OPEN.add(d.id);dibujar()}else OPEN.delete(d.id)})})}

/* ---------------- tema y navegación ---------------- */
function tema(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("tema",r.dataset.theme)}catch(e){};dibujar()}
try{const t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("#tema").onclick=tema;
function etq(k,n){return k==="prog"&&D&&D.hoy?`${n} · ${ddmm(D.hoy)}`:n}
function tabs(){$("#tabs").innerHTML=`<div role="tablist" aria-label="Secciones del monitor" style="display:flex;gap:2px">${SECC.map(([k,n])=>`<button role="tab" id="tab-${k}" aria-controls="s-${k}" aria-selected="false" tabindex="-1" data-k="${k}">${etq(k,n)}</button>`).join("")}</div>`
    +`<select id="secsel" aria-label="Sección">${SECC.map(([k,n])=>`<option value="${k}">${etq(k,n)}</option>`).join("")}</select>`;
  $("#secsel").onchange=e=>ver(e.target.value);
  $("#main").innerHTML=SECC.map(([k])=>`<section id="s-${k}" role="tabpanel" aria-labelledby="tab-${k}" tabindex="0"></section>`).join("");
  const bs=[...document.querySelectorAll("[role=tab]")];
  bs.forEach((b,i)=>{b.onclick=()=>ver(b.dataset.k);b.onkeydown=e=>{const j=e.key==="ArrowRight"?i+1:e.key==="ArrowLeft"?i-1:e.key==="Home"?0:e.key==="End"?bs.length-1:null;
    if(j==null)return;e.preventDefault();const n=bs[(j+bs.length)%bs.length];n.focus();ver(n.dataset.k)}});
  let k=location.hash.slice(1);try{k=k||localStorage.getItem("tab")}catch(e){};ver(SECC.some(s=>s[0]===k)?k:"resumen",true)}
function ver(k,ini){ACT=k;document.querySelectorAll("[role=tab]").forEach(b=>{const on=b.dataset.k===k;b.setAttribute("aria-selected",on);b.tabIndex=on?0:-1});
  if($("#secsel"))$("#secsel").value=k;
  document.querySelectorAll("section[role=tabpanel]").forEach(s=>s.classList.toggle("on",s.id==="s-"+k));
  history.replaceState(null,"","#"+k);try{localStorage.setItem("tab",k)}catch(e){};if(!ini)window.scrollTo({top:0});dibujar()}

/* ---------------- tabla con búsqueda, orden y CSV ---------------- */
function tabla(id,cols,filas,opt={}){
  const el=$(id);if(!el)return;let orden=null,asc=true,q="";
  const vis=()=>filas.filter(f=>!q||JSON.stringify(f).toLowerCase().includes(q));
  function pintar(){let fs=vis();
    if(orden!=null){const c=cols[orden];fs=[...fs].sort((a,b)=>{const x=c.v(a),y=c.v(b);return(x>y?1:x<y?-1:0)*(asc?1:-1)})}
    el.querySelector("tbody").innerHTML=fs.length?fs.map(f=>`<tr${opt.cls?` class="${opt.cls(f)}"`:""}>`+cols.map(c=>`<td class="${c.num?"num":c.t==="Descripción"||c.t==="Actividades"?"desc":["Horario","Unidad","Línea","Estado","Inicio","Fin"].includes(c.t)?"cort":""}">${c.num?(c.h?c.h(f):esc(c.v(f))):romanos(c.h?c.h(f):esc(c.v(f)))}</td>`).join("")+"</tr>").join("")
      :`<tr><td colspan="${cols.length}" style="color:var(--muted)">Sin registros.</td></tr>`;
    el.querySelector(".n").textContent=`${fs.length} de ${filas.length}`;
    el.querySelectorAll("th").forEach((th,i)=>th.setAttribute("aria-sort",orden===i?(asc?"ascending":"descending"):"none"))}
  el.innerHTML=`<div class="tools" ${opt.simple?'style="display:none"':""}><input placeholder="Buscar…" aria-label="Buscar en la tabla"><span class="n" aria-live="polite"></span><button class="csv" type="button" title="Descargar CSV">⭳ CSV</button></div>
   <div class="tbl" tabindex="0" role="region" aria-label="${esc(opt.titulo||"Tabla de detalle")}"><table class="${opt.simple?"min":""}"><thead><tr>${cols.map((c,i)=>`<th class="${c.num?"num":""}" scope="col"><button type="button" data-i="${i}">${c.t}</button></th>`).join("")}</tr></thead><tbody></tbody></table></div>`;
  el.querySelector("input").oninput=e=>{q=e.target.value.toLowerCase();pintar()};
  el.querySelector(".csv").onclick=()=>{const fs=vis();
    const c=x=>{const t=String(x??"").replace(/"/g,'""');return /[",;\n]/.test(t)?`"${t}"`:t};
    const txt="﻿"+[cols.map(k=>c(k.t)).join(";"),...fs.map(f=>cols.map(k=>{const v=k.csv?k.csv(f):k.v(f);return c(typeof v==="number"?String(v).replace(".",","):v)}).join(";"))].join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));a.download=(id.replace("#","")||"tabla")+"_"+D.dia+".csv";a.click()};
  el.querySelectorAll("th button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;asc=orden===i?!asc:true;orden=i;pintar()});
  pintar()}

/* ---------------- gráficos ---------------- */
function grafico(id,cfg){const c=new Chart($(id),cfg);charts.push(c);return c}
// relleno degradado bajo una serie (transparencia hacia el eje)
const degr=(col,a="44")=>c=>{const{ctx,chartArea}=c.chart;if(!chartArea)return col+"22";const g=ctx.createLinearGradient(0,chartArea.top,0,chartArea.bottom);g.addColorStop(0,col+a);g.addColorStop(1,col+"00");return g};
function base(yTit){const g=css("--grid"),t=css("--text-2");
  return{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},animation:false,
   plugins:{legend:{labels:{color:t,usePointStyle:true,pointStyle:"circle",boxWidth:7,boxHeight:7,padding:14}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${f2(c.parsed.y)}`}}},
   scales:{x:{grid:{color:g,drawTicks:false},border:{display:false},ticks:{color:t,maxRotation:0,autoSkip:true,padding:6}},y:{grid:{color:g,drawTicks:false},border:{display:false,dash:[3,3]},ticks:{color:t,padding:6},title:{display:!!yTit,text:yTit,color:t}}}}}
// línea vertical en el intervalo seleccionado (cronología de transmisión)
const marca=idx=>({id:"marca",afterDatasetsDraw(c){if(idx==null)return;const x=c.ctx,xs=c.scales.x.getPixelForValue(idx);x.save();x.strokeStyle=css("--naranja");x.setLineDash([4,3]);x.lineWidth=2;

/* ================= RENDER ================= */
const R={},DR={};
function render(){
  const dia=new Date(D.dia+"T12:00"),fmt=d=>d.toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("#meta").innerHTML=`Día evaluado: <b>${fmt(dia)}</b><br>Actualizado ${actTxt()} · TC ${D.tc}`;
  SECC.forEach(([k])=>{try{R[k]()}catch(e){console.warn(k,e);$("#s-"+k).innerHTML=est("error",`No se pudo mostrar esta sección (${esc(e.message)}). El resto del tablero sigue disponible.`)}});

/* CMg proyectado del Programa Semanal (YUPANA): días posteriores al corte dentro del mes evaluado */
function proyMes(b){const P=D.cmg_proy;if(!P||!P.diario||!P.diario[b])return null;const mes=D.dia.slice(0,7),ej=D.cmg_diario[b]||{};
  const fut=Object.entries(P.diario[b]).filter(([d])=>d>D.dia&&d.slice(0,7)===mes).sort();
  const pas=Object.entries(P.diario[b]).filter(([d])=>d<=D.dia&&fin(ej[d]));
  const nMes=new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate(),ejd=Object.entries(ej).filter(([d])=>d<=D.dia);
  const vals=[...ejd.map(x=>x[1]),...fut.map(x=>x[1])];
  return{fut,est:vals.length?vals.reduce((a,x)=>a+x,0)/vals.length:null,dias:vals.length,nMes,nEj:ejd.length,
    desvio:pas.length?pas.reduce((a,[d,v])=>a+Math.abs(v-ej[d]),0)/pas.length:null,nPas:pas.length,sesgo:pas.length?pas.reduce((a,[d,v])=>a+(v-ej[d]),0)/pas.length:null}}
/* ---------- 1. RESUMEN ---------- */
function notaProy(){const P=D.cmg_proy;
  if(P&&P.error)return `<div class="note">Proyección del Programa Semanal no publicada: ${esc(P.error)}</div>`;
  const x=proyMes("Santa Rosa 220");if(!x||!x.fut.length)return P?`<div class="note">El Programa Semanal vigente no tiene días posteriores al corte dentro de este mes.</div>`:"";
  const d1=x.fut[0][0],d2=x.fut[x.fut.length-1][0];
  return `<div class="strip" style="margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--card-b)">
   <div><div class="lbl">Promedio del mes estimado · Santa Rosa</div><b>${f2(x.est)} USD/MWh</b> <span class="mut">ejecutado ${f2(D.cmg_mes["Santa Rosa 220"])} (1–${+D.dia.slice(8,10)})</span></div>
   <div><div class="lbl">Proyectado ${ddmm(d1)}–${ddmm(d2)}</div><b>${f2(x.fut.reduce((a,v)=>a+v[1],0)/x.fut.length)} USD/MWh</b> <span class="mut">promedio de ${x.fut.length} días</span></div>
   ${x.nPas?`<div><div class="lbl">Desvío en días ya ejecutados</div><b>±${f2(x.desvio)}</b> <span class="mut">${x.sesgo>0?"sobreestimó":"subestimó"} ${f2(Math.abs(x.sesgo))} en ${x.nPas} días</span></div>`:""}
   <div class="mut" style="flex-basis:100%">Estimado, no ejecutado: combina ${x.nEj} días ejecutados y ${x.fut.length} proyectados (${x.dias} de ${x.nMes} días del mes${x.dias<x.nMes?"; faltan días sin proyección publicada":""}). Proyección: COES, Programa Semanal de Operación (YUPANA), versión ${esc(P.version)}, semana ${esc((P.semanas||[]).map(w=>w.split(" a ").map(fN).join("–")).join(" y "))}; unidad ${esc(P.metodo_unidad)}.</div></div>`}

    ${kc({ic:"cal",lbl:"Demanda máxima",val:f0(K.demanda.portal??K.demanda.valor),un:"MW",sub:`${K.demanda.hora?`a las ${K.demanda.hora} h · `:""}${K.demanda.delta_dia!=null?chipV(K.demanda.delta_dia,`MW vs. mismo día de ${K.demanda.ant}`,{un:"",dec:0}):""}`})}
    ${kc({ic:"alert",lbl:"Eventos registrados",val:EV.length,sub:`${nF} ${nF===1?"falla":"fallas"} · ${EV.length-nF} otros · IEOD ${ddmm(D.dia_ieod||D.dia)}`})}
   </div>
   ${(D.alertas||[]).length?`<div class="alertas" aria-label="Alertas por umbral">${D.alertas.map(a=>`<a class="alerta ${a.nivel}" href="#${a.seccion}" onclick="ver('${a.seccion}');return false"><b>${esc(a.titulo)}</b><span>${esc(a.motivo)}</span></a>`).join("")}</div>`:""}
   <div class="grid g64">
    ${box(`Evolución del CMg · ${mes}`,`Santa Rosa 220 kV · USD/MWh · promedio diario ejecutado del 1 al ${+TB.dia.slice(8,10)} de ${mes} (corte: ${fL(TB.dia)})${(proyMes("Santa Rosa 220")||{fut:[]}).fut.length?" y proyección del Programa Semanal en la zona sombreada":""} · toca la leyenda para ver otras barras`,

    <div class="card"><h2>Qué vigilar · ${fL(TB.hoy)}<small>Programación del ${fN(TB.hoy)} y programa mensual · hasta 3 asuntos</small></h2>
     ${TB.vigilar.length?`<div class="lst">${TB.vigilar.slice(0,3).map(x=>`<div class="it"><span class="ii">${ico(icV[x.seccion]||"info",22)}</span><div class="tx"><b>${esc(x.texto)}</b>${x.horario?`<span>Horario programado: ${esc(x.horario)}</span>`:""}</div><div class="hr"><button class="lnk" onclick="ver('${x.seccion}')">Ver detalle →</button></div></div>`).join("")}</div>`

   ${acc("det-res","doc","Ver detalle completo del día",`${D.bloques?[["paso","Qué pasó"],["huanchor","Huanchor"],["vigilar","Programación y mantenimiento"]].filter(([k])=>(D.bloques[k]||[]).length).map(([k,n])=>`<div class="blq"><div class="lbl centt">${n}</div><ul class="bul">${D.bloques[k].map(t=>`<li>${t}</li>`).join("")}</ul></div>`).join(""):""}
      <div class="blq"><div class="lbl centt">Todos los datos</div><ul class="bul">${D.resumen.map(t=>`<li>${t}</li>`).join("")}</ul></div>`)}
   ${pie("COES – costos marginales (portal), Portal de Información (demanda), IEOD (eventos e indisponibilidades) y Programa Diario de Intervenciones",`${fL(TB.dia)} · mes ${mes} hasta el corte`)}

/* ---------- 2. HUANCHOR ---------- */
function precioHu(H){return H.capturado_mes!=null?{val:f2(H.capturado_mes),un:"USD/MWh"}:{val:"Sin dato disponible",un:"",txt:1}}

  const dd=H.diario,dN=+D.dia.slice(8,10),mes=MESN[+D.dia.slice(5,7)-1];

  let c="";if(fin(vD))c+=`La energía del ${fL(D.dia)} ${frase(vD)} frente al mismo día de ${H.ant}`;
  if(fin(vM))c+=(c?"; ":"La energía ")+`en el mes (1–${H.dias_comp} de ${mes}) ${frase(vM)} frente a ${H.ant}`;
  c=c?c+".":"Sin datos comparables de producción para el período.";

      <li><b>Promedio:</b> integral de la potencia indisponible ÷ 24 h. <b>Capacidad indisponible integrada:</b> ${IS?f0(IS.mwh):f0(prom*24)} MWh. <b>Potencia al cierre</b> (24:00): ${IS?f0(IS.cierre):f0(tot[47])} MW.</li>
      <li>Una misma capacidad física se cuenta una sola vez por intervalo: por central se toma el mayor entre el registro de central completa y la suma de sus unidades.</li>
      <li>Forzada = potencia de registros forzados en el intervalo; programada = total del intervalo − forzada, así la suma nunca excede el total sin duplicar.</li>
      <li>La suma simple de los ${sinD.length} registros (${f0(sinD.reduce((s,r)=>s+(r.mw||0),0))} MW) no es potencia simultánea.</li>
      <li><b>Los MWh de capacidad indisponible no equivalen a energía que se habría generado ni a pérdida económica.</b></li></ul>`)}
   </div>
   ${pie("COES – IEOD, hojas INDISP y MANTENIMIENTO EJECUTADOS",fL(dia))}
  </div>`;
  tabla("#t-iu",[{t:"Central",v:r=>tit(r.c)},{t:"Unidad",v:r=>r.u},{t:"Horario",v:r=>r.ini,h:r=>per({inicio:r.ini,final:r.fin},dia)},{t:"Tipo",v:r=>r.tipo,h:r=>r.tipo.split(" + ").map(t=>`<span class="${t==="Forzada"?"chip fs":"chip est"}">${t}</span>`).join(" ")},
    {t:"MW",num:1,v:r=>r.mw,h:r=>`<b>${f1(r.mw)}</b>`},{t:"Actividades",v:r=>r.regs.map(x=>x.descripcion).join(" | "),h:r=>r.n>1?`<details><summary>${r.n} actividades</summary>${r.regs.map(x=>`<div class="mut">• ${esc(per(x,dia))} · ${f1(x.mw)} MW · ${esc(x.descripcion)}</div>`).join("")}</details>`:esc(r.regs[0].descripcion)},
    {t:"Fuente",v:()=>fuente}],grupos,{titulo:"Unidades y actividades"});
  const colI=[{t:"Empresa",v:r=>tit(r.empresa)},{t:"Central",v:r=>tit(r.ubicacion)},{t:"Unidad",v:r=>r.equipo},
    {t:"Tecnología",v:r=>r.tecnologia||"",h:r=>r.diesel?'<span class="tag">Diésel · excluido</span>':esc(r.tecnologia||"")},{t:"Horario",v:r=>r.inicio,h:r=>per(r)},
    {t:"MW",num:1,v:r=>r.mw,h:r=>f1(r.mw)},{t:"Tipo",v:r=>r.programado?"Programada":"Forzada",h:r=>r.programado?'<span class="tag">Programada</span>':'<span class="tag f">Forzada</span>'},{t:"Descripción",v:r=>r.descripcion}];
  tabla("#t-ind",colI,[...D.indisponibilidades].sort((a,b)=>(a.diesel-b.diesel)||(b.mw-a.mw)),{titulo:"Detalle de indisponibilidades"});
  if(dsl.length)tabla("#t-ind2",colI,dsl,{titulo:"Indisponibilidades diésel"});
};
DR.indisp=()=>{if(!$("#c-indp"))return;const dia=D.dia_ieod||D.dia,sinD=D.indisponibilidades.filter(r=>!r.diesel&&r.mw>0),h0=new Date(dia+"T00:00");
  const tot=perfil(sinD,dia),fz=perfil(sinD,dia,r=>!r.programado),pg=tot.map((v,k)=>Math.max(0,v-fz[k]));
  const o=base("MW");o.scales.y.stacked=true;o.scales.y.beginAtZero=true;o.plugins.legend.display=false;o.scales.x.ticks.maxTicksLimit=9;
  o.plugins.tooltip.callbacks.title=it=>`${lab48[it[0].dataIndex]}–${hhmm(it[0].dataIndex+1)} h · total ${f0(tot[it[0].dataIndex])} MW`;
  o.plugins.tooltip.callbacks.label=c=>`${c.dataset.label}: ${f0(c.parsed.y)} MW`;
  o.plugins.tooltip.callbacks.afterBody=it=>{const a=activos(sinD,new Date(h0.getTime()+(it[0].dataIndex*30+15)*6e4)).sort((x,y)=>y.mw-x.mw);
    return a.length?["Unidades:",...a.slice(0,7).map(r=>`• ${romanos(tit(r.ubicacion))}${r.equipo!=="CENTRAL"?" "+r.equipo:""} ${f0(r.mw)} MW · ${r.programado?"prog.":"forzada"} · ${String(r.descripcion||"").slice(0,40)}`),...(a.length>7?[`… y ${a.length-7} más`]:[])]:[]};
  grafico("#c-indp",{type:"line",data:{labels:lab48,datasets:[{label:"Programada",data:pg,stepped:true,fill:true,borderColor:css("--navy"),backgroundColor:css("--navy")+"b3",borderWidth:1,pointRadius:0},
    {label:"Forzada",data:fz,stepped:true,fill:"-1",borderColor:css("--s2"),backgroundColor:css("--s2")+"cc",borderWidth:1,pointRadius:0}]},options:o})};

/* ---------- 9. TRANSMISIÓN Y EVENTOS ---------- */
const evMin=e=>{const d=new Date(e.inicio);return d.getHours()*60+d.getMinutes()};
function trSel(i){TRS=TRS===i?null:i;rerender("trans");setTimeout(()=>{const c=$("#tr-graf");if(c&&TRS!=null)c.scrollIntoView({behavior:"smooth",block:"center"})},80)}
R.trans=()=>{const el=$("#s-trans"),dia=D.dia_ieod||D.dia,fuente=D.dia_ieod?`IEOD ${fN(D.dia_ieod)}`:"IEOD no disponible";
  const EV=[...(D.eventos||[])].sort((a,b)=>(a.inicio>b.inicio?1:-1)),nF=EV.filter(e=>/falla/i.test(e.tipo)).length;
  const FL=Object.entries(D.flujos||{}).map(([cod,x])=>{const v=x.serie.map(p=>p[1]),ab=v.map(Math.abs);return{cod,...x,max:Math.max(...ab),prom:v.reduce((a,b)=>a+b,0)/v.length,min:Math.min(...v),mx:Math.max(...v)}}).sort((a,b)=>b.max-a.max);
  const CG=D.congestion||{columnas:[],registros:[]},EN=Object.entries(D.enlaces||{});
  const conc=`El ${fL(dia)} el IEOD registra ${EV.length} eventos (${nF} fallas), publica flujos de ${FL.length} líneas ≥220 kV y ${CG.registros.length?`reporta ${CG.registros.length} congestiones`:"no reporta congestiones"}. La coincidencia horaria entre eventos, flujos y precios no implica causalidad.`;
  el.innerHTML=`<div class="grid">
   ${hdr("Transmisión y eventos",`Flujos, diferencias de precio y eventos · ${fN(dia)}`,`<span class="fch">${ico("cal",15)} ${fL(dia)}</span>`)}
   ${concl(conc)}
   <div class="grid g3">
    ${kc({ic:"bolt",lbl:"Eventos registrados",val:EV.length,sub:`<span class="chip fs">${nF} ${nF===1?"falla":"fallas"}</span> · ${EV.length-nF} otros`})}
    ${kc({ic:"tower",lbl:"Líneas con datos de flujo",val:FL.length,sub:`≥220 kV · ${fuente}`})}
    ${kc({ic:"alert",lbl:"Congestiones reportadas",val:CG.registros.length?CG.registros.length:"Sin registros",txt:!CG.registros.length,sub:CG.registros.length?"ver Restricciones operativas":"Según el reporte del día; no equivale a ausencia de restricciones"})}
   </div>
   <div class="grid g2" id="tr-graf">
    ${box("Flujos por enlace",`MW cada 30 min · valor publicado por el COES (hoja INTERCONEXIONES). El signo es el del COES; la hoja no indica el sentido, así que no se reinterpreta.`,
      EN.length?lgd(EN.map(([n],i)=>[css(i?"--s7":"--navy"),n.replace(" - ","–")]))+cv("c-tre",`Flujo total de los enlaces ${EN.map(e=>e[0]).join(" y ")} cada 30 minutos.`):est("vacio","El IEOD no publica flujos de interconexión para este día."))}
    ${box("Diferenciales de CMg",`USD/MWh cada 30 min · ${fL(D.dia)} · Socabaya 220 − Santa Rosa 220 y Piura 220 − Santa Rosa 220 (diferencia de precios entre barras, no un flujo)`,
      lgd(D.barras.slice(1).map(b=>[css(SERIE[b]),`${corta(b)} − Santa Rosa`]))+cv("c-trd","Diferencia de CMg por intervalo entre Socabaya y Santa Rosa y entre Piura y Santa Rosa."))}
   </div>
   ${TRS!=null?`<div class="estado">${ico("clock",16)} Marcado en los gráficos: ${esc(EV[TRS]?hm(EV[TRS].inicio):"")} h · ${esc(EV[TRS]?lin(EV[TRS].equipo)+" · "+tit(EV[TRS].ubicacion):"")} <button class="lnk" onclick="trSel(${TRS})">Quitar marca</button></div>`:""}
   <div class="card"><h2>Cronología del día<small>${fuente} · hoja EVENTOS · selecciona “Ubicar” para marcar la hora en los gráficos</small></h2>
    ${EV.length?`<div class="lst">${EV.map((e,i)=>`<div class="it"><div class="hr" style="text-align:left;min-width:46px"><b>${hm(e.inicio)}</b></div><span class="ii">${ico(/falla/i.test(e.tipo)?"bolt":"info",18)}</span>
      <div class="tx"><b>${esc(tit(e.tipo))} · ${esc(lin(e.equipo))} · ${esc(romanos(tit(e.ubicacion)))}</b><span>${esc(e.descripcion)}${e.mw?` · ${f1(e.mw)} MW interrumpidos`:""}${e.interrupcion?" · con interrupción de suministro":""} · ${per(e,dia)} · Fuente: ${fuente}</span></div>
      <div class="hr"><button class="lnk" aria-pressed="${TRS===i}" onclick="trSel(${i})">${TRS===i?"Marcado":"Ubicar"}</button><br><button class="lnk" onclick="abrirAcc('tr-ev')">Detalle</button></div></div>`).join("")}</div>`:est("vacio","Sin eventos registrados en el IEOD.")}</div>
   <div class="accs">
    ${acc("tr-flu","net","Flujos por línea",`<div class="grid">${FL.length?box("Líneas con mayor flujo absoluto",`${fuente} · MW cada 30 min · las 8 de mayor |MW| (signo = sentido según el COES)`,cv("c-flu","Líneas con mayor flujo absoluto.","tall"))+'<div id="t-flu"></div>':est("vacio","Sin flujos por línea.")}
      ${EN.map(([n,e],i)=>box(`Enlace ${esc(n)} · líneas`,`${fuente} · MW · total y cada línea`,cv("c-enl"+i,`Flujos de las líneas del enlace ${n}.`))).join("")}
      <div class="note">“Mayor flujo absoluto” no implica mayor utilización: para un porcentaje de carga se requieren límites operativos válidos de cada línea, que esta fuente no publica.</div></div>`)}
    ${acc("tr-int","wrench","Intervenciones en transmisión",`<div id="t-lin"></div>`)}
    ${acc("tr-res","doc","Restricciones operativas",`${CG.columnas.length?`<h3 class="h3">Congestiones (IEOD)</h3>${CG.registros.length?'<div id="t-cg"></div>':est("vacio","El IEOD no reporta congestiones ese día.")}`:""}<h3 class="h3">Restricciones operativas</h3><div id="t-res"></div>`)}
    ${acc("tr-ev","list","Detalle de eventos y fuentes",`<div id="t-ev"></div><div class="note">Fuente: COES, IEOD del ${fN(dia)} (hojas EVENTOS, FLUJOS, INTERCONEXIONES, CONGESTION_SIST_TRANS y RESTRIC_OPE). CMg: portal de costos marginales del COES.</div>`)}
   </div>
   ${pie("COES – IEOD y costos marginales",fL(dia))}
  </div>`;
  const colLin=[{t:"Línea",v:r=>r.equipo},{t:"kV",num:1,v:r=>r.kv},{t:"Empresa",v:r=>tit(r.empresa)},{t:"Tramo",v:r=>tit(r.ubicacion)},{t:"Horario",v:r=>r.inicio,h:r=>per(r)},{t:"Estado",v:r=>r.estado,h:r=>r.estado==="F/S"?'<span class="chip fs">Fuera de servicio</span>':r.estado==="E/S"?'<span class="chip est">En servicio</span>':esc(r.estado||"")},{t:"Descripción",v:r=>r.descripcion}];
  if(CG.registros.length)tabla("#t-cg",CG.columnas.filter(c=>CG.registros.some(r=>r[c])).map(c=>({t:tit(c),v:r=>r[c]||"",h:r=>esc(/^\d{4}-\d\d-\d\dT/.test(r[c]||"")?r[c].slice(0,16).replace("T"," "):lin(r[c]||""))})),CG.registros,{titulo:"Congestiones"});
  if(FL.length)tabla("#t-flu",[{t:"Línea",v:r=>r.cod},{t:"Tramo",v:r=>(D.tramos||{})[r.cod]||""},{t:"kV",num:1,v:r=>r.kv},{t:"Medido en",v:r=>tit(r.nombre)},{t:"Máx. |MW|",num:1,v:r=>r.max,h:r=>f0(r.max)},{t:"Mín.",num:1,v:r=>r.min,h:r=>f0(r.min)},{t:"Máx.",num:1,v:r=>r.mx,h:r=>f0(r.mx)},{t:"Promedio",num:1,v:r=>r.prom,h:r=>f0(r.prom)}],FL,{titulo:"Flujos por línea"});
  tabla("#t-lin",colLin,[...D.lineas_220].sort((a,b)=>b.kv-a.kv),{titulo:"Intervenciones ejecutadas en transmisión"});
  tabla("#t-ev",[{t:"Tipo",v:r=>tit(r.tipo)},{t:"Empresa",v:r=>tit(r.empresa)},{t:"Equipo",v:r=>`${lin(r.equipo)} · ${tit(r.ubicacion)}`},{t:"Horario",v:r=>r.inicio,h:r=>per(r)},
    {t:"kV",num:1,v:r=>r.kv||""},{t:"MW",num:1,v:r=>r.mw||"",h:r=>r.mw?f1(r.mw):""},{t:"Descripción",v:r=>r.descripcion}],EV,{titulo:"Eventos"});
  tabla("#t-res",[{t:"Empresa",v:r=>tit(r.empresa)},{t:"Ubicación",v:r=>tit(r.ubicacion)},{t:"Equipo",v:r=>r.equipo},{t:"Horario",v:r=>`${r.inicio}–${r.final}`},{t:"Descripción",v:r=>r.descripcion}],D.restricciones,{titulo:"Restricciones operativas"});
};
DR.trans=()=>{const EV=[...(D.eventos||[])].sort((a,b)=>(a.inicio>b.inicio?1:-1));
  const idx=TRS!=null&&EV[TRS]?Math.min(47,Math.max(0,Math.ceil(evMin(EV[TRS])/30)-1)):null;
  const ser=arr=>{const m=Object.fromEntries(arr);return labFin.map((_,k)=>m[(k+1)*30]??null)};
  const comun=o=>{o.scales.x.ticks.maxTicksLimit=9;o.plugins.legend.display=false;o.scales.y.afterFit=s=>{s.width=62};o.plugins.tooltip.callbacks.title=it=>`${it[0].label} h`;return o};
  if($("#c-tre")){const o=comun(base("MW"));o.plugins.tooltip.callbacks.label=c=>`${c.dataset.label}: ${f0(c.parsed.y)} MW`;
    grafico("#c-tre",{type:"line",data:{labels:labFin,datasets:Object.entries(D.enlaces||{}).map(([n,e],i)=>({label:n.replace(" - ","–"),data:ser(e.total),borderColor:css(i?"--s7":"--navy"),backgroundColor:css(i?"--s7":"--navy"),borderWidth:2.4,pointRadius:0,tension:.2}))},options:o,plugins:[marca(idx)]})}
  if($("#c-trd")){const ref=D.barras[0],A=prDia(ref,D.dia),o=comun(base("USD/MWh"));o.plugins.tooltip.callbacks.label=c=>`${c.dataset.label}: ${fin(c.parsed.y)?(c.parsed.y>0?"+":"")+f2(c.parsed.y):"sin dato"}`;
    grafico("#c-trd",{type:"line",data:{labels:labFin,datasets:D.barras.slice(1).map(b=>{const B=prDia(b,D.dia);return{label:`${corta(b)} − ${corta(ref)}`,data:B.map((v,k)=>fin(v)&&fin(A[k])?v-A[k]:null),borderColor:css(SERIE[b]),backgroundColor:css(SERIE[b]),borderWidth:2.2,pointRadius:0,tension:.2}})},options:o,plugins:[marca(idx)]})}
  Object.entries(D.enlaces||{}).forEach(([n,e],i)=>{if(!$("#c-enl"+i))return;const cols=["--s1","--s3","--s4","--s7","--s5","--muted"];
    const o=base("MW");o.plugins.tooltip.callbacks.label=c=>`${c.dataset.label}: ${f0(c.parsed.y)} MW`;
    grafico("#c-enl"+i,{type:"line",data:{labels:labFin,datasets:[{label:"Total",data:ser(e.total),borderColor:css("--s2"),backgroundColor:css("--s2"),borderWidth:3,pointRadius:0,tension:.2},
      ...Object.entries(e.lineas).map(([ln,sr],j)=>({label:(m=>m&&(D.tramos||{})["L-"+m[1]]?`L-${m[1]} ${(D.tramos||{})["L-"+m[1]]}`:ln)(String(ln).match(/L-?\s?(\d{4}[A-Z]?)/i)),data:ser(sr),borderColor:css(cols[j%cols.length]),backgroundColor:css(cols[j%cols.length]),borderWidth:1.3,pointRadius:0,tension:.2}))]},options:o})});
  if($("#c-flu")){const FL=Object.entries(D.flujos||{}).map(([cod,x])=>({cod,...x,max:Math.max(...x.serie.map(p=>Math.abs(p[1])))})).sort((a,b)=>b.max-a.max).slice(0,8);
    const cols=["--s1","--s2","--s3","--s4","--s7","--s8","--s5","--muted"],o=base("MW");o.plugins.tooltip.callbacks.label=c=>`${c.dataset.label}: ${f0(c.parsed.y)} MW`;
    grafico("#c-flu",{type:"line",data:{labels:labFin,datasets:FL.map((l,j)=>({label:(D.tramos||{})[l.cod]?`${l.cod} ${(D.tramos||{})[l.cod]}`:`${l.cod}${l.nombre?" (medido en "+tit(l.nombre.replace(/^SE\s+/i,""))+")":""}`,data:ser(l.serie),borderColor:css(cols[j]),backgroundColor:css(cols[j]),borderWidth:2,pointRadius:0,tension:.2}))},options:o})}};

/* ---------------- dibujo ---------------- */
function dibujar(){if(!D)return;charts.forEach(c=>c.destroy());charts=[];
  try{DR[ACT]&&DR[ACT]()}catch(e){console.warn("gráficos",ACT,e)}}

fetch("reportes.json",{cache:"no-store"}).then(r=>r.json()).then(l=>{if(l&&l.length){const a=$("#pdf");a.href="reportes/"+l[0];a.download=l[0];a.style.display="inline-block"}}).catch(()=>{});
fetch("datos.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{D=d;tabs();render();dibujar()})
 .catch(()=>{$("#meta").textContent="No se pudieron cargar los datos.";$("#main").innerHTML=est("error","No se pudieron cargar los datos del tablero (datos.json). Intenta recargar la página en unos minutos.")});
</script>
