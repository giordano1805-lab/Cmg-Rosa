<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor SEIN Huanchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f7; --surface:#fcfcfb; --surface-2:#f0f2f5; --border:#e2e4e8;
  --text:#0b0b0b; --text-2:#52514e; --muted:#8a8986; --brand:#001a6f; --naranja:#ff5716; --amarillo:#ffb210;
  --s1:#2b4fd1; --s2:#f0590f; --s3:#e9a300; --s4:#1baf7a; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s9:#8f1d2c; --s10:#b0457a; --base:#6f8bf5; --linea:#001a6f;
  --grid:rgba(0,0,0,.07); --bad:#c5221f; --good:#137333;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#2f2f2c;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e88; --brand:#001a6f; --naranja:#ff5716; --amarillo:#ffb210;
    --s1:#6f8bf5; --s2:#c93f08; --s3:#b88c14; --s4:#199e70; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#c25a66; --s10:#c86a9a; --base:#9fb1f7; --linea:#f0efec;
    --grid:rgba(255,255,255,.08); --bad:#f28b82; --good:#81c995;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#2f2f2c;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e88; --brand:#001a6f; --naranja:#ff5716; --amarillo:#ffb210;
  --s1:#6f8bf5; --s2:#c93f08; --s3:#b88c14; --s4:#199e70; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#c25a66; --s10:#c86a9a; --base:#9fb1f7; --linea:#f0efec;
  --grid:rgba(255,255,255,.08); --bad:#f28b82; --good:#81c995;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
header{background:#fff;color:var(--brand);padding:12px 16px;border-bottom:4px solid transparent;border-image:linear-gradient(90deg,var(--naranja),var(--amarillo)) 1}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0}
header img{height:40px;display:none}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;color:var(--brand);padding-left:14px;border-left:1px solid #d9dce6}
header .meta{margin-left:auto;font-size:12.5px;color:#52514e;text-align:right}
header .btn{background:var(--naranja);color:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}
header button{background:transparent;border:1px solid #c9cde0;color:var(--brand);border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit;font-size:12px}
nav{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;color:var(--text-2);font:inherit;font-weight:500;padding:12px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--text);border-color:var(--naranja)}
main{padding:18px 0 40px}
section{display:none} section.on{display:block}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0}
.card h2{font-size:14.5px;margin:0 0 10px;font-weight:600}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.kpi .lbl{color:var(--text-2);font-size:12.5px}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:2px 0}
.kpi .val small{font-size:13px;font-weight:500;color:var(--text-2);margin-left:3px}
.kpi .sub{font-size:12.5px;color:var(--text-2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.up{color:var(--bad)} .down{color:var(--good)}
ul.bul{margin:0;padding-left:18px} ul.bul li{margin:4px 0}
.chart{position:relative;height:300px} .chart.tall{height:360px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tools input{flex:1;min-width:180px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}
.tools .n{color:var(--muted);font-size:12.5px}
.tbl{overflow:auto;max-height:520px;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px}
table.min{min-width:0}
td.desc{min-width:280px}
td.cort{white-space:nowrap}
th,td{padding:6px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border)}
th{position:sticky;top:0;background:var(--surface-2);font-weight:600;color:var(--text-2);cursor:pointer;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:var(--surface-2)}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--text-2)}
.tag.f{background:rgba(197,34,31,.12);color:var(--bad)}
.note{color:var(--muted);font-size:12px;margin-top:8px}
a{color:var(--s1)}
.pdfs a{display:block;padding:7px 0;border-bottom:1px solid var(--border)}
.emb{display:grid;grid-template-columns:minmax(0,3fr) minmax(170px,1fr);gap:14px}
.embk{display:flex;gap:22px;margin-bottom:8px;font-size:15px}.embk .lbl{font-size:12px;color:var(--text-2)}
.cent ul{margin:6px 0 10px;padding-left:16px;font-size:12.5px;color:var(--text-2)}.cent li{margin:2px 0}
.embd{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin:12px 0 4px;padding:8px 10px;border-radius:8px;background:var(--grid);font-size:13px}
.embd .lbl{font-size:12px;color:var(--text-2)}
.chart.sm{height:170px}
.tag.rf{background:var(--s9);color:#fff;padding:1px 7px;border-radius:5px;font-size:12px;font-weight:600}
.cent .tot{display:inline-block;background:#fff3c4;color:#001a6f;font-weight:700;font-size:12.5px;padding:3px 8px;border-radius:6px}
.tecs .tag{margin:2px 4px 2px 0;font-size:12.5px}
.centt{font-weight:600;color:#001a6f}
:root[data-theme="dark"] .centt{color:#9fb1f7}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .centt{color:#9fb1f7}}
@media (max-width:700px){.emb{grid-template-columns:1fr}}
@media (max-width:600px){header img{height:30px}header h1{font-size:15px;border:0;padding-left:0;width:100%}.g4{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px}.kpi .val{font-size:21px}.kpi .val small{display:block;margin:0;font-size:11.5px}.chart{height:250px}.chart.tall{height:300px}header .meta{margin-left:0;text-align:left}}
</style>
</head>
<body>
<header><div class="wrap">
  <img id="logo" src="logo.png" alt="Hidroeléctrica Huanchor" onload="this.style.display='block'">
  <h1>Monitor diario del SEIN</h1>
  <div class="meta" id="meta">Cargando…</div>
  <a id="pdf" class="btn" href="#" target="_blank" style="display:none">Descargar PDF</a>
  <button id="tema" title="Cambiar tema claro/oscuro">Tema</button>
</div></header>
<nav><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="main"></main>

<script>
const SECC=[["resumen","Resumen"],["precios","Precios"],["oferta","Oferta y demanda"],["embalses","Embalses"],
["prog","Programado hoy"],["indisp","Indisponibilidades"],["trans","Transmisión y eventos"]];
const $=s=>document.querySelector(s);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const f2=v=>v==null?"–":Number(v).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const f0=v=>v==null?"–":Number(v).toLocaleString("es-PE",{maximumFractionDigits:0});
const f1=v=>v==null?"–":Number(v).toLocaleString("es-PE",{minimumFractionDigits:1,maximumFractionDigits:1});
const tit=s=>(s||"").toLowerCase().replace(/(^|[\s.(\/-])([a-záéíóúñü])/g,(m,a,b)=>a+b.toUpperCase());
const hm=s=>{if(!s)return"";const d=new Date(s);return d.toTimeString().slice(0,5)};
const per=(r,dia)=>{dia=dia||D.dia_ieod||D.dia;const sig=new Date(new Date(dia+"T12:00").getTime()+864e5).toISOString().slice(0,10);
  const fmt=(s,fin)=>{if(!s)return"";const fecha=s.slice(0,10),t=s.slice(11,16);
    if(fin&&fecha===sig&&t==="00:00")return"24:00";return fecha===dia?t:`${fecha.slice(8,10)}/${fecha.slice(5,7)} ${t}`};
  return `${fmt(r.inicio)}–${fmt(r.final,true)}`};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D,charts=[];
const SERIE={"Santa Rosa 220":"--s1","Socabaya 220":"--s2","Piura 220":"--s3"};
const BLOQ={"Punta (18-23 h)":"--s2","Media (6-18 h)":"--s3","Base (23-6 h)":"--base"};
const GEN={"Hídrica":"--s1","Gas natural":"--s2","Solar":"--s3","Eólica":"--s4","Carbón":"--muted","Biomasa":"--s7","Diésel/Residual":"--s8","Otros":"--muted","D2 Reserva Fría":"--s9","Diésel/Residual otras":"--s8"};

function tema(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("tema",r.dataset.theme)}catch(e){};dibujar()}
try{const t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("#tema").onclick=tema;

function tabs(){$("#tabs").innerHTML=SECC.map(([k,n])=>`<button data-k="${k}">${n}</button>`).join("");
  $("#main").innerHTML=SECC.map(([k])=>`<section id="s-${k}"></section>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>ver(b.dataset.k));
  let k=location.hash.slice(1);try{k=k||localStorage.getItem("tab")}catch(e){};ver(SECC.some(s=>s[0]===k)?k:"resumen")}
function ver(k){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==="s-"+k));
  history.replaceState(null,"","#"+k);try{localStorage.setItem("tab",k)}catch(e){};dibujar()}

function tabla(id,cols,filas,opt={}){
  const el=$(id);let orden=null,asc=true,q="";
  function pintar(){let fs=filas.filter(f=>!q||JSON.stringify(f).toLowerCase().includes(q));
    if(orden!=null){const c=cols[orden];fs=[...fs].sort((a,b)=>{const x=c.v(a),y=c.v(b);return(x>y?1:x<y?-1:0)*(asc?1:-1)})}
    el.querySelector("tbody").innerHTML=fs.length?fs.map(f=>"<tr>"+cols.map(c=>`<td class="${c.num?"num":c.t==="Descripción"?"desc":["Horario","Unidad","Línea","Estado"].includes(c.t)?"cort":""}">${c.h?c.h(f):esc(c.v(f))}</td>`).join("")+"</tr>").join("")
      :`<tr><td colspan="${cols.length}" style="color:var(--muted)">Sin registros.</td></tr>`;
    el.querySelector(".n").textContent=`${fs.length} de ${filas.length}`}
  el.innerHTML=`<div class="tools" ${opt.simple?'style="display:none"':""}><input placeholder="Buscar…" aria-label="Buscar"><span class="n"></span></div>
   <div class="tbl"><table class="${opt.simple?"min":""}"><thead><tr>${cols.map((c,i)=>`<th data-i="${i}" class="${c.num?"num":""}">${c.t}</th>`).join("")}</tr></thead><tbody></tbody></table></div>`;
  el.querySelector("input").oninput=e=>{q=e.target.value.toLowerCase();pintar()};
  el.querySelectorAll("th").forEach(th=>th.onclick=()=>{const i=+th.dataset.i;asc=orden===i?!asc:true;orden=i;pintar()});
  pintar()}

function grafico(id,cfg){const c=new Chart($(id),cfg);charts.push(c);return c}
function base(yTit){const g=css("--grid"),t=css("--text-2");
  return{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
   plugins:{legend:{labels:{color:t,usePointStyle:true,pointStyle:"circle",boxWidth:7,boxHeight:7,padding:14}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${f2(c.parsed.y)}`}}},
   scales:{x:{grid:{color:g},ticks:{color:t,maxRotation:0,autoSkip:true}},y:{grid:{color:g},ticks:{color:t},title:{display:!!yTit,text:yTit,color:t}}}}}

function render(){
  const dia=new Date(D.dia+"T12:00"),fmt=d=>d.toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("#meta").innerHTML=`Día evaluado: <b>${fmt(dia)}</b><br>Actualizado ${new Date(D.generado).toLocaleString("es-PE",{dateStyle:"short",timeStyle:"short"})} · TC ${D.tc}`;
  const kp=D.barras.map(b=>{const d=D.cmg_diario[b][D.dia],p=D.cmg_prev[b],v=d&&p?(d/p-1)*100:null;
    return `<div class="card kpi"><div class="lbl"><span class="dot" style="background:var(${SERIE[b]})"></span>CMg ${b} kV</div>
     <div class="val">${f2(d)}<small>USD/MWh</small></div>
     <div class="sub">${v==null?"":`<span class="${v>0?"up":"down"}">${v>0?"▲":"▼"} ${Math.abs(v).toFixed(1)}%</span> vs. día anterior · `}mes ${f2(D.cmg_mes[b])}</div></div>`}).join("");
  const dmx=D.demanda_areas.length?D.demanda_areas.reduce((a,r)=>r.sein>a.sein?r:a):null;
  const sinD=D.indisponibilidades.filter(r=>!r.diesel);const mwI=sinD.reduce((s,r)=>s+(r.mw||0),0);
  $("#s-resumen").innerHTML=`<div class="grid g4">${kp}
   <div class="card kpi"><div class="lbl">Máxima demanda SEIN</div><div class="val">${dmx?f0(dmx.sein):"–"}<small>MW</small></div><div class="sub">${dmx?"a las "+dmx.hora+" h":""}</div></div>
   <div class="card kpi"><div class="lbl">Generación indisponible (sin diésel)</div><div class="val">${f0(mwI)}<small>MW</small></div><div class="sub">${sinD.length} registros · ${sinD.filter(r=>!r.programado).length} forzados</div></div>
   <div class="card kpi"><div class="lbl">Eventos del día</div><div class="val">${D.eventos.length}</div><div class="sub">${D.eventos.filter(e=>/falla/i.test(e.tipo)).length} fallas · ${D.lineas_220.length} intervenciones en líneas ≥220 kV</div></div></div>
   <div class="grid g2" style="margin-top:14px"><div class="card"><h2>Resumen ejecutivo</h2><ul class="bul">${D.resumen.map(t=>`<li>${t}</li>`).join("")}</ul></div>
   <div class="card"><h2>CMg promedio diario del mes<small>USD/MWh</small></h2><div class="chart"><canvas id="c-mes"></canvas></div></div></div>`;

  $("#s-precios").innerHTML=`<div class="grid">
   <div class="card"><h2>CMg cada 30 minutos<small>día anterior y día evaluado · USD/MWh</small></h2><div class="chart tall"><canvas id="c-30"></canvas></div></div>
   <div class="grid g2"><div class="card"><h2>Santa Rosa 220 kV por bloque horario<small>USD/MWh</small></h2><div class="chart"><canvas id="c-bl"></canvas></div></div>
   <div class="card"><h2>Promedios por bloque</h2><div id="t-bl"></div></div></div></div>`;
  tabla("#t-bl",[{t:"Bloque",v:r=>r[0],h:r=>`<span class="dot" style="background:var(${BLOQ[r[0]]})"></span>${esc(r[0])}`},{t:"Día",num:1,v:r=>r[1],h:r=>f2(r[1])},{t:"Mes",num:1,v:r=>r[2],h:r=>f2(r[2])}],
    Object.keys(D.bloques_mes).map(b=>[b,D.bloques_diario[b][D.dia],D.bloques_mes[b]]),{simple:1});

  const DH=D.demanda_hist,HP=D.hidro_pasada,pct=(a,b)=>a!=null&&b?(a/b-1)*100:null;
  const kv=(lbl,val,un,p,sub)=>`<div class="card kpi"><div class="lbl">${lbl}</div><div class="val">${val}<small>${un}</small></div><div class="sub">${p==null?"":`<span class="${p<0?"up":"down"}">${p>0?"▲":"▼"} ${Math.abs(p).toFixed(1)}%</span> `}${sub}</div></div>`;
  let kpis="";
  if(DH){const a=DH.act,b=DH.ant;kpis+=kv(`Demanda del mes a la fecha (${DH.dias} días)`,f0(DH.mtd_gwh[a]),"GWh",pct(DH.mtd_gwh[a],DH.mtd_gwh[b]),`vs. ${f0(DH.mtd_gwh[b])} GWh en ${b}`)
    +kv(`Demanda acumulada ${a}`,f2(DH.ytd_twh[a]),"TWh",pct(DH.ytd_twh[a],DH.ytd_twh[b]),`vs. ${f2(DH.ytd_twh[b])} TWh en ${b}`)}
  [[HP,"Hidro de pasada"],[D.hidro_regulacion,"Hidro de embalse"],[D.eolica,"Eólica"]].forEach(([R,n])=>{
    if(R&&R.mtd[R.act]!=null)kpis+=kv(`${n} · promedio del mes`,f0(R.mtd[R.act]),"MW",pct(R.mtd[R.act],R.mtd[R.ant]),`vs. ${f0(R.mtd[R.ant])} MW en ${R.ant}`)});
  const DU=D.diesel_unidades||[];
  $("#s-oferta").innerHTML=`<div class="grid">${kpis?`<div class="grid g4">${kpis}</div>`:""}
   ${DH?`<div class="grid g2"><div class="card"><h2>Demanda de energía por mes<small>TWh · ${DH.ant} vs ${DH.act}</small></h2><div class="chart"><canvas id="c-dmes"></canvas></div><div class="note">* Mes en curso: primeros ${DH.dias} días de cada año.</div></div>
   <div class="card"><h2>Demanda acumulada del mes<small>GWh · mismo período del año anterior</small></h2><div class="chart"><canvas id="c-dacum"></canvas></div></div></div>`:""}
   ${HP?`<div class="card"><h2>Generación hidroeléctrica de pasada<small>MW · promedio diario vs ${HP.ant} (líneas tenues: cada 30 min)</small></h2><div class="chart tall"><canvas id="c-hidro"></canvas></div></div>`:""}
   ${D.hidro_regulacion?`<div class="card"><h2>Generación hidroeléctrica de embalse (regulación)<small>MW · promedio diario vs ${D.hidro_regulacion.ant}</small></h2><div class="chart tall"><canvas id="c-hreg"></canvas></div></div>`:""}
   ${D.eolica?`<div class="card"><h2>Generación eólica<small>MW · promedio diario vs ${D.eolica.ant}</small></h2><div class="chart tall"><canvas id="c-eol"></canvas></div></div>`:""}
   <div class="card"><h2>Producción por tipo de recurso<small>MW cada 30 min · ${D.dia}${DU.length||"D2 Reserva Fría" in (D.grupos_gen||{})?" · diésel separado con el IEOD":""}</small></h2><div class="chart tall"><canvas id="c-gen"></canvas></div></div>
   <div class="card"><h2>Térmicas con diésel, residual o gas de refinería<small>${D.dia_ieod?"IEOD "+D.dia_ieod+" · HOP y despacho ejecutado":"IEOD no disponible"}</small></h2>${DU.length?'<div id="t-dsl"></div>':'<div class="note" style="margin:0">Ninguna central operó con diésel, residual o gas de refinería ese día.</div>'}</div>
   <div class="card"><h2>Demanda por área<small>MW</small></h2><div class="chart"><canvas id="c-dem"></canvas></div></div></div>`;

  if(DU.length)tabla("#t-dsl",[{t:"Central / grupo",v:r=>r.nombre},{t:"Empresa",v:r=>r.empresa},
    {t:"Combustible",v:r=>r.tipo_comb||r.combustible,h:r=>`${esc(r.tipo_comb||"")} <span style="color:var(--muted)">(${esc(r.combustible)})</span>`},
    {t:"Clasificación",v:r=>r.rf?1:0,h:r=>r.tipo_comb&&r.tipo_comb!=="Diésel D2"?"–":r.rf?'<span class="tag rf">Reserva Fría</span>':"Otra"},
    {t:"Horario",v:r=>r.inicio||"",h:r=>r.inicio&&r.final?per(r):""},
    {t:"MW máx.",num:1,v:r=>r.mw_max,h:r=>r.mw_max!=null?f1(r.mw_max):"–"},{t:"MWh",num:1,v:r=>r.mwh,h:r=>r.mwh!=null?f0(r.mwh):"–"},
    {t:"Tipo de operación",v:r=>tit(r.tipo)}],DU);
  const fuente=D.dia_ieod?`IEOD ${D.dia_ieod}`:"IEOD no disponible";
  const dsl=D.indisponibilidades.filter(r=>r.diesel),mwP=sinD.filter(r=>r.programado).reduce((s,r)=>s+r.mw,0),mwF=mwI-mwP;
  const porTec={};sinD.forEach(r=>porTec[r.tecnologia||"Otra"]=(porTec[r.tecnologia||"Otra"]||0)+r.mw);

      y:{grid:{display:false},ticks:{color:css("--text"),autoSkip:false,font:{size:11.5}}}};
    o.plugins.tooltip.callbacks={title:it=>PG[it[0].dataIndex].descripcion.slice(0,90),label:it=>{const r=PG[it.dataIndex];return `${r.tecnologia||""} · ${f1(r.mw)} MW · ${per(r,D.hoy)}`}};
    const ang=innerWidth<600,cor=t=>ang&&t.length>16?t.slice(0,15)+"…":t;
    o.scales.x.ticks.stepSize=ang?6:2;o.scales.x.ticks.maxRotation=0;
    grafico("#c-pgg",{type:"bar",data:{labels:PG.map(r=>`${cor((tit(r.ubicacion).replace(/^Reserva Fria De (Generacion )?/i,"RF ")+(r.equipo==="CENTRAL"?"":" "+r.equipo)).trim())} · ${f0(r.mw)} MW`),
      datasets:[{data:PG.map(r=>[hrs(r.inicio),Math.max(hrs(r.final),hrs(r.inicio)+.25)]),backgroundColor:PG.map(r=>r.diesel?css("--muted")+"55":css(TECC[r.tecnologia]||"--muted")),borderRadius:4,borderSkipped:false,barPercentage:.75}]},options:o})}
  Object.entries(D.enlaces||{}).forEach(([n,e],i)=>{if(!on("#c-enl"+i))return;
    const lab=Array.from({length:48},(_,k)=>{const m=(k+1)*30;return `${String(Math.floor(m/60)%24).padStart(2,"0")}:${m%60?"30":"00"}`});
    const cols=["--s1","--s3","--s4","--s7","--s5","--muted"],ser=(arr)=>{const m=Object.fromEntries(arr);return lab.map((_,k)=>m[(k+1)*30]??null)};
    const o=base("MW");o.plugins.tooltip.callbacks.label=c=>`${c.dataset.label}: ${f0(c.parsed.y)} MW`;
    grafico("#c-enl"+i,{type:"line",data:{labels:lab,datasets:[{label:"Total",data:ser(e.total),borderColor:css("--s2"),backgroundColor:css("--s2"),borderWidth:3,pointRadius:0,tension:.2},
      ...Object.entries(e.lineas).map(([ln,sr],j)=>({label:ln,data:ser(sr),borderColor:css(cols[j%cols.length]),backgroundColor:css(cols[j%cols.length]),borderWidth:1.3,pointRadius:0,tension:.2}))]},options:o})});
  if(on("#c-flu")){const FL=Object.entries(D.flujos||{}).map(([cod,x])=>({cod,...x,max:Math.max(...x.serie.map(p=>Math.abs(p[1])))})).sort((a,b)=>b.max-a.max).slice(0,8);
    const cols=["--s1","--s2","--s3","--s4","--s7","--s8","--s5","--muted"];
    const lab=Array.from({length:48},(_,i)=>{const m=(i+1)*30;return `${String(Math.floor(m/60)%24).padStart(2,"0")}:${m%60?"30":"00"}`});
    const o=base("MW");o.plugins.tooltip.callbacks.label=c=>`${c.dataset.label}: ${f0(c.parsed.y)} MW`;
    grafico("#c-flu",{type:"line",data:{labels:lab,datasets:FL.map((l,j)=>{const m=Object.fromEntries(l.serie);return{label:`${l.cod}${l.nombre?" ("+tit(l.nombre.replace(/^SE\s+/i,""))+")":""}`,data:lab.map((_,i)=>m[(i+1)*30]??null),borderColor:css(cols[j]),backgroundColor:css(cols[j]),borderWidth:2,pointRadius:0,tension:.2}})},options:o})}
  const diaria=(id,di,dec)=>{const ya=Object.keys(di.serie).sort(),f0=new Date(di.serie[ya[ya.length-1]][0]?.[0]||di.fecha);
    const x=s=>Math.round((new Date(s)-f0)/864e5),lab=k=>{const d=new Date(f0.getTime()+k*864e5);return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")};
    const o=base("Hm3");o.scales.x={type:"linear",grid:{color:css("--grid")},ticks:{color:css("--text-2"),stepSize:5,callback:v=>lab(v)}};o.scales.y.beginAtZero=true;o.interaction={mode:"nearest",axis:"x",intersect:false};
    o.plugins.tooltip.callbacks.title=it=>lab(it[0].parsed.x);o.plugins.tooltip.callbacks.label=t=>`${t.dataset.label}: ${t.parsed.y.toFixed(dec)} Hm3`;
    const est=["--muted","--s4","--s1","--s2"].slice(4-ya.length);
    grafico(id,{type:"scatter",data:{datasets:ya.map((y,j)=>{const act=j===ya.length-1,col=css(est[j]);
      return {label:y,data:di.serie[y].map(([f,v])=>({x:x(f),y:v})),showLine:true,borderColor:col,backgroundColor:col,borderWidth:act?3:(j===ya.length-2?2:1.2),borderDash:j===0&&ya.length===4?[5,4]:[],pointRadius:act?2.5:0}})},options:o})};
  (D.embalses_semanal?.cuencas||[]).forEach((c,i)=>{if(!on("#c-emb"+i))return;
    if(c.solo_diario){diaria("#c-emb"+i,c.diario,2);return}
    if(c.diario?.representativo&&$("#c-embd"+i))diaria("#c-embd"+i,c.diario,1);
    const ys=Object.keys(c.anios).sort().slice(-4),est=["--muted","--s4","--s1","--s2"].slice(4-ys.length);
    const o=base("Hm3");o.scales.x={type:"linear",min:1,max:53,grid:{color:css("--grid")},ticks:{color:css("--text-2"),stepSize:4}};o.scales.y.beginAtZero=true;o.interaction={mode:"nearest",axis:"x",intersect:false};
    o.plugins.tooltip.callbacks.title=it=>`Semana ${it[0].parsed.x}`;o.plugins.tooltip.callbacks.label=t=>`${t.dataset.label}: ${f1(t.parsed.y)} Hm3`;
    grafico("#c-emb"+i,{type:"scatter",data:{datasets:ys.map((y,j)=>({label:y,data:Object.entries(c.anios[y]).map(([k,v])=>({x:+k,y:v})).sort((p,q)=>p.x-q.x),showLine:true,
      borderColor:css(est[j]),backgroundColor:css(est[j]),borderWidth:j===ys.length-1?3:(j===ys.length-2?2:1.2),borderDash:j===0&&ys.length===4?[5,4]:[],pointRadius:j===ys.length-1?2:0}))},options:o})});
  if(on("#c-dem")&&D.demanda_areas.length){const o=base("MW");o.scales.y.stacked=true;o.scales.y.beginAtZero=true;o.plugins.tooltip.callbacks.label=c=>`${c.dataset.label}: ${f0(c.parsed.y)} MW`;
    grafico("#c-dem",{type:"line",data:{labels:D.demanda_areas.map(r=>r.hora),datasets:[["norte","Norte","--s3"],["centro","Centro","--s1"],["sur","Sur","--s2"]].map(([k,n,c])=>({label:n,data:D.demanda_areas.map(r=>r[k]),fill:true,backgroundColor:css(c),borderColor:css("--surface"),borderWidth:1,pointRadius:0}))},options:o})}
}

fetch("reportes.json",{cache:"no-store"}).then(r=>r.json()).then(l=>{if(l&&l.length){const a=$("#pdf");a.href="reportes/"+l[0];a.download=l[0];a.style.display="inline-block"}}).catch(()=>{});
fetch("datos.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{D=d;tabs();render();dibujar()})
 .catch(()=>{$("#meta").textContent="No se pudieron cargar los datos."});
</script>
</body>
